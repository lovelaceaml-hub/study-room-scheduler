<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eeeee4">
  <meta name="description" content="Reserve a study room, whiteboard or TV at LV Zion.">
  <title>LV Zion · Study Rooms</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/app/app.css">
  <script type="module" src="/app/main.js"></script>
</head>
<body>
  <div class="page">
    <header class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <h1>LV Zion <span>Study Rooms</span></h1>
        <span class="status-pill" id="status-pill">Connecting</span>
      </div>
      <nav class="links" aria-label="Pages">
        <a href="?view=mine" id="mine-link">My reservations</a>
        <a href="/admin/">Admin</a>
      </nav>
      <div class="reserve-bar">
        <button type="button" class="primary reserve-button" id="reserve" disabled>
          <span>Reserve</span>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12h14m-5-5 5 5-5 5"/></svg>
        </button>
      </div>
    </header>

    <main class="schedule">
      <h2 class="schedule-title">Schedule</h2>
      <div class="dates" id="dates" role="group" aria-label="Day"></div>
      <section class="board" aria-label="Day schedule">
        <div class="board-top">
          <div class="types" id="types" role="group" aria-label="Show"></div>
          <p class="board-caption"><span id="day-caption"></span><span id="hint"></span></p>
          <div class="unit-headings" id="unit-headings" aria-hidden="true"></div>
        </div>
        <div class="notice" id="notice" role="status"></div>
        <div class="grid" id="grid"></div>
        <p class="legend" id="legend"></p>
      </section>
    </main>
  </div>

  <dialog class="sheet" id="booking-sheet" aria-labelledby="booking-title"></dialog>
  <dialog class="sheet" id="details-sheet" aria-labelledby="details-title"></dialog>
  <dialog class="sheet" id="mine-sheet" aria-labelledby="mine-title"></dialog>
  <p class="visually-hidden" id="announcer" role="status" aria-live="polite"></p>
  <script>
    var LIVE_APP_RELEASE_NEXT_URL = "https://lvrooms--next-qtbbhh5q.web.app/";
    var LIVE_APP_RELEASE_VERSION_LABEL = "next version";
    var LIVE_APP_RELEASE_STORAGE_KEY = "liveAppRelease.choice";
    var LIVE_APP_RELEASE_STAY_DAYS = 7;
    if (!window.location.hostname.includes("--next-")) {
      (function () {
        function readChoice() {
          try {
            var raw = localStorage.getItem(LIVE_APP_RELEASE_STORAGE_KEY);
            return raw ? JSON.parse(raw) : null;
          } catch (e) {
            return null;
          }
        }
        function writeChoice(choice) {
          try {
            localStorage.setItem(LIVE_APP_RELEASE_STORAGE_KEY, JSON.stringify({ choice: choice, at: Date.now() }));
          } catch (e) {}
        }
        var stored = readChoice();
        if (stored && stored.choice === "next") {
          window.location.replace(LIVE_APP_RELEASE_NEXT_URL);
          return;
        }
        if (stored && stored.choice === "stay") {
          var stayMs = LIVE_APP_RELEASE_STAY_DAYS * 24 * 60 * 60 * 1000;
          if (Date.now() - stored.at < stayMs) return;
        }
        document.addEventListener("DOMContentLoaded", function () {
          var banner = document.createElement("div");
          banner.id = "live-app-release-banner";
          banner.setAttribute("role", "dialog");
          banner.setAttribute("aria-modal", "false");
          banner.setAttribute("aria-labelledby", "live-app-release-text");
          banner.style.position = "fixed";
          banner.style.left = "50%";
          banner.style.bottom = "16px";
          banner.style.transform = "translateX(-50%)";
          banner.style.zIndex = "2147483000";
          banner.style.maxWidth = "min(92vw, 480px)";
          banner.style.width = "100%";
          banner.style.background = "#1b1f24";
          banner.style.color = "#f4f6f8";
          banner.style.border = "1px solid #3a4048";
          banner.style.borderRadius = "10px";
          banner.style.boxShadow = "0 6px 24px rgba(0, 0, 0, 0.35)";
          banner.style.padding = "14px 16px";
          banner.style.font = "14px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
          banner.style.display = "flex";
          banner.style.flexWrap = "wrap";
          banner.style.alignItems = "center";
          banner.style.gap = "10px 14px";
          var text = document.createElement("p");
          text.id = "live-app-release-text";
          text.textContent = "A new version is ready (" + LIVE_APP_RELEASE_VERSION_LABEL + ").";
          text.style.margin = "0";
          text.style.flex = "1 1 220px";
          text.style.color = "#f4f6f8";
          var actions = document.createElement("div");
          actions.style.display = "flex";
          actions.style.gap = "8px";
          actions.style.flexWrap = "wrap";
          var tryBtn = document.createElement("button");
          tryBtn.type = "button";
          tryBtn.textContent = "Try the new version";
          tryBtn.style.background = "#4f8cff";
          tryBtn.style.color = "#05101f";
          tryBtn.style.fontWeight = "600";
          tryBtn.style.border = "1px solid #4f8cff";
          tryBtn.style.borderRadius = "6px";
          tryBtn.style.padding = "8px 12px";
          tryBtn.style.cursor = "pointer";
          tryBtn.addEventListener("click", function () {
            writeChoice("next");
            window.location.href = LIVE_APP_RELEASE_NEXT_URL;
          });
          var stayBtn = document.createElement("button");
          stayBtn.type = "button";
          stayBtn.textContent = "Stay on this version";
          stayBtn.style.background = "transparent";
          stayBtn.style.color = "#f4f6f8";
          stayBtn.style.border = "1px solid #6b7280";
          stayBtn.style.borderRadius = "6px";
          stayBtn.style.padding = "8px 12px";
          stayBtn.style.cursor = "pointer";
          stayBtn.addEventListener("click", function () {
            writeChoice("stay");
            banner.hidden = true;
          });
          actions.appendChild(tryBtn);
          actions.appendChild(stayBtn);
          banner.appendChild(text);
          banner.appendChild(actions);
          document.body.appendChild(banner);
        });
      })();
    }
  </script>
  <p><a href="https://lvrooms.web.app/" onclick="try{localStorage.removeItem('liveAppRelease.choice');}catch(e){}">Back to the current version</a></p>

  <noscript><p class="noscript">This app needs JavaScript. The <a href="/tv.html">lobby schedule</a> shows today’s study rooms.</p></noscript>
</body>
</html>
