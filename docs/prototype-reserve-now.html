<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>LV Rooms: Reserve Now prototype</title>
<style>
:root{
  --bg:#05070f; --ink:#f4f5ff; --muted:rgba(244,245,255,.66); --faint:rgba(244,245,255,.42);
  --glass:rgba(255,255,255,.065); --line:rgba(255,255,255,.14);
  --contact1:#ff6a98; --contact2:#ff2d75;
  --new1:#35e0f5; --new2:#0ea5e9;
  --other1:#ffcf4d; --other2:#ff8a2b;
  --avail:#34d399;
  --cta1:#ff3d81; --cta2:#ff7a45;
  --row:44px; --gutter:58px;
  --spring:cubic-bezier(.22,1.2,.36,1);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent}
input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:3px}
svg{display:block}

/* ---------- sky: animated aurora + grain ---------- */
.sky{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(120% 80% at 50% -10%,#151b4d 0%,#090c22 55%,#05070f 100%)}
.orb{position:absolute;border-radius:50%;filter:blur(72px);opacity:.55;mix-blend-mode:screen;will-change:transform}
.orb.a{width:540px;height:540px;left:-170px;top:-140px;background:#7c3aed;animation:drift1 26s ease-in-out infinite alternate}
.orb.b{width:480px;height:480px;right:-150px;top:110px;background:#06b6d4;animation:drift2 32s ease-in-out infinite alternate}
.orb.c{width:440px;height:440px;left:18%;top:58%;background:#ec4899;opacity:.42;animation:drift3 38s ease-in-out infinite alternate}
.orb.d{width:320px;height:320px;right:8%;top:74%;background:#f59e0b;opacity:.32;animation:drift1 30s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(120px,90px) scale(1.15)}}
@keyframes drift2{to{transform:translate(-140px,120px) scale(.9)}}
@keyframes drift3{to{transform:translate(90px,-140px) scale(1.2)}}
.grain{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.08;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

/* ---------- layout ---------- */
.app{position:relative;z-index:1;max-width:660px;margin:0 auto;padding:22px 16px 150px}
.rise{animation:rise .7s var(--spring) both}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

.brand{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.brand .dot{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--cta1),var(--other1));box-shadow:0 0 14px var(--cta1)}
h1{margin:8px 0 6px;font-size:42px;line-height:1;font-weight:900;letter-spacing:-.035em;background:linear-gradient(180deg,#fff 20%,#c3c6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--cta1),var(--other1));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:0;color:var(--muted);font-size:14px}

.days{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line);margin-top:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.days button{padding:8px 18px;border-radius:999px;font-weight:800;font-size:15px;color:var(--muted);transition:.25s var(--spring);text-align:center}
.days button span{display:block;font-size:10px;font-weight:700;opacity:.7;letter-spacing:.1em;text-transform:uppercase;margin-top:1px}
.days button.on{background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.1));color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 16px rgba(0,0,0,.35)}

.panel{position:relative;border-radius:26px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:inset 0 1px 0 rgba(255,255,255,.24),0 24px 60px rgba(0,0,0,.45);padding:16px}

/* ---------- 3D keycaps ---------- */
.key{position:relative;border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(255,255,255,.05));border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -4px 0 rgba(0,0,0,.4),0 12px 26px rgba(0,0,0,.4);transition:transform .16s var(--spring),box-shadow .16s,background .2s}
.key:hover{background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.08))}
.key:active,.key.pressed{transform:translateY(4px);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -1px 0 rgba(0,0,0,.4),0 4px 12px rgba(0,0,0,.4)}

/* ---------- toggles / live counts ---------- */
.toggles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0 14px}
.tile{padding:14px 12px 12px;text-align:left;border-radius:22px;color:var(--muted)}
.tile .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;margin-bottom:12px;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 14px rgba(0,0,0,.35)}
.tile .ic svg{width:20px;height:20px}
.tile.room .ic{background:linear-gradient(160deg,#a78bfa,#6d28d9)}
.tile.tv .ic{background:linear-gradient(160deg,#67e8f9,#0284c7)}
.tile.whiteboard .ic{background:linear-gradient(160deg,#fde68a,#f97316)}
.tile b{display:block;font-size:26px;font-weight:900;line-height:1;color:#fff;font-variant-numeric:tabular-nums}
.tile b i{font-style:normal;font-size:13px;font-weight:700;color:var(--muted);margin-left:2px}
.tile small{display:block;font-size:11px;margin-top:5px;color:var(--faint)}
.tile .nm{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.tile.on{background:linear-gradient(160deg,rgba(124,58,237,.6),rgba(6,182,212,.4));border-color:rgba(255,255,255,.4);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -4px 0 rgba(0,0,0,.35),0 14px 34px rgba(88,60,220,.45)}
.tile.on small,.tile.on b i{color:rgba(255,255,255,.75)}

/* ---------- schedule ---------- */
.sched-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sched-head h2{margin:0;font-size:20px;font-weight:900;letter-spacing:-.02em}
.sched-head h2 span{color:var(--muted);font-weight:600}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted);font-weight:700}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.legend .c{background:linear-gradient(160deg,var(--contact1),var(--contact2))}
.legend .n{background:linear-gradient(160deg,var(--new1),var(--new2))}
.legend .o{background:linear-gradient(160deg,var(--other1),var(--other2))}
.legend .a{background:rgba(52,211,153,.25);border:1px solid rgba(52,211,153,.6)}
.legend .s{background:repeating-linear-gradient(135deg,rgba(255,255,255,.3) 0 2px,transparent 2px 4px)}

.grid{--n:4;--colw:1fr;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:thin;padding-bottom:4px}
.grid::-webkit-scrollbar{height:7px}
.grid::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border-radius:9px}
.g-head,.g-body{display:grid;grid-template-columns:var(--gutter) repeat(var(--n),var(--colw));column-gap:6px;min-width:min-content}
.grid.wide{--colw:minmax(96px,1fr)}
.g-head{margin-bottom:8px}
.unit{padding:8px 4px;border-radius:14px;text-align:center;font-size:12px;font-weight:800;line-height:1.15;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.05));border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -3px 0 rgba(0,0,0,.35),0 8px 16px rgba(0,0,0,.35)}
.unit i{display:block;font-style:normal;font-size:9.5px;font-weight:700;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.g-body{position:relative;background-image:repeating-linear-gradient(180deg,rgba(255,255,255,.08) 0 1px,transparent 1px calc(var(--row)*2))}
.g-gut{position:relative;position:sticky;left:0;z-index:6;background:linear-gradient(90deg,rgba(12,15,40,.92) 60%,rgba(12,15,40,0))}
.g-head>div:first-child{position:sticky;left:0;z-index:5}
.tl{position:absolute;right:6px;transform:translateY(-50%);font-size:11px;color:var(--faint);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;background:rgba(10,13,36,.92);padding:2px 5px;border-radius:7px;z-index:2}
.col{position:relative}
.band{position:absolute;left:0;right:0;z-index:3;background:repeating-linear-gradient(135deg,rgba(255,255,255,.07) 0 8px,rgba(255,255,255,.02) 8px 16px);border-top:1px dashed rgba(255,255,255,.22);border-bottom:1px dashed rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center}
.band span{position:sticky;left:calc(var(--gutter) + 10px);font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);text-shadow:0 1px 2px rgba(0,0,0,.8);white-space:nowrap}
.now{position:absolute;left:0;right:0;z-index:4;height:2px;background:#fff;box-shadow:0 0 12px #fff,0 0 26px var(--cta1);pointer-events:none}
.now i{position:absolute;left:calc(var(--gutter) - 6px);top:-5px;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 12px #fff;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.35)}}

.blk{position:absolute;left:0;right:0;z-index:2;border-radius:11px;padding:6px 5px;overflow:hidden;font-size:11px;line-height:1.25;text-align:left;width:100%}
.blk.res{color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -2px 0 rgba(0,0,0,.25),0 8px 18px rgba(0,0,0,.4)}
.blk.res::after{content:'';position:absolute;inset:0 0 52% 0;background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0));pointer-events:none}
.blk.contact{background:linear-gradient(160deg,var(--contact1),var(--contact2))}
.blk.new{background:linear-gradient(160deg,var(--new1),var(--new2));color:#032535}
.blk.other{background:linear-gradient(160deg,var(--other1),var(--other2));color:#2a1200}
.blk.avail{background:rgba(52,211,153,.11);border:1px solid rgba(52,211,153,.42);color:#bdf7de;box-shadow:inset 0 1px 0 rgba(255,255,255,.12);transition:background .2s,transform .2s}
.blk.avail:hover{background:rgba(52,211,153,.2);transform:scale(1.02)}
.blk .tag{display:block;font-weight:900;text-transform:uppercase;letter-spacing:.03em;font-size:9px;line-height:1.15;white-space:normal;overflow:hidden}
.blk .who{display:block;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.blk .when{display:block;opacity:.85;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.blk.avail .tag{color:#6ee7b7}
.blk.pop{animation:pop .9s var(--spring) both}
@keyframes pop{0%{transform:scale(.6);opacity:0;filter:brightness(2)}60%{transform:scale(1.06)}100%{transform:none;opacity:1;filter:none}}
.grid.dense .blk .tag{font-size:8.5px;letter-spacing:0}.grid.dense .blk .who{font-size:10.5px}.grid.dense .blk .when{font-size:9.5px}
@media (max-width:430px){:root{--gutter:46px}.blk{padding:5px 4px;font-size:10.5px}.blk .who{font-size:11px}.unit{font-size:11px}.tl{font-size:10px;right:5px}}

/* ---------- Reserve Now: always on screen ---------- */
.cta-wrap{position:fixed;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom));z-index:50;display:flex;justify-content:center;pointer-events:none}
.cta-float{animation:float 3.8s ease-in-out infinite;pointer-events:auto;filter:drop-shadow(0 22px 34px rgba(255,61,129,.45))}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.cta{position:relative;display:inline-flex;align-items:center;gap:12px;padding:19px 36px 20px;border-radius:999px;font-weight:900;font-size:20px;letter-spacing:.01em;color:#fff;overflow:hidden;
  background:linear-gradient(135deg,var(--cta1),var(--cta2));
  box-shadow:inset 0 2px 0 rgba(255,255,255,.5),inset 0 -5px 0 rgba(120,0,40,.4),0 6px 14px rgba(0,0,0,.45);
  transition:transform .14s var(--spring),box-shadow .14s}
.cta::before{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.6) 50%,transparent 68%);transform:translateX(-130%);animation:sheen 4.2s ease-in-out infinite;pointer-events:none}
@keyframes sheen{0%,58%{transform:translateX(-130%)}92%,100%{transform:translateX(130%)}}
.cta:active{transform:translateY(4px);box-shadow:inset 0 2px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(120,0,40,.4),0 2px 6px rgba(0,0,0,.45)}
.cta .plus{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.cta .plus svg{width:16px;height:16px}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(3,5,15,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .35s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;z-index:70;width:min(100%,660px);max-height:90vh;overflow:auto;transform:translate(-50%,112%);
  background:linear-gradient(180deg,rgba(34,38,86,.94),rgba(12,15,42,.97));backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);
  border-radius:30px 30px 0 0;border:1px solid rgba(255,255,255,.2);border-bottom:0;
  box-shadow:0 -24px 70px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.28);padding:10px 18px calc(26px + env(safe-area-inset-bottom));
  transition:transform .6s var(--spring)}
.sheet.on{transform:translate(-50%,0)}
.grip{width:44px;height:5px;border-radius:99px;background:rgba(255,255,255,.28);margin:2px auto 8px}
.sheet-top{display:flex;align-items:center;justify-content:space-between;height:40px}
.sheet-top .nav{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.3);transition:.2s}
.sheet-top .nav svg{width:18px;height:18px}
.sheet-top .nav[hidden]{display:none}
.dots{display:flex;gap:6px}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2);transition:.3s}
.dots i.done{background:rgba(255,255,255,.55)}
.dots i.on{width:22px;border-radius:99px;background:linear-gradient(90deg,var(--cta1),var(--cta2));box-shadow:0 0 12px rgba(255,61,129,.6)}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 2px;min-height:22px}
.crumb{font-size:11px;font-weight:800;padding:4px 9px;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid var(--line);color:var(--muted);letter-spacing:.02em}
.crumb.contact{background:linear-gradient(160deg,var(--contact1),var(--contact2));color:#fff;border-color:transparent}
.crumb.new{background:linear-gradient(160deg,var(--new1),var(--new2));color:#032535;border-color:transparent}
.crumb.other{background:linear-gradient(160deg,var(--other1),var(--other2));color:#2a1200;border-color:transparent}
.step{animation:stepIn .45s var(--spring) both}
@keyframes stepIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
.step.back{animation-name:stepBack}
@keyframes stepBack{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.step h3{margin:10px 0 4px;font-size:26px;font-weight:900;letter-spacing:-.025em;line-height:1.1}
.step .hint{margin:0 0 16px;color:var(--muted);font-size:14px}

.types{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.type{padding:16px 10px 14px;text-align:center;border-radius:22px}
.type .ic{width:56px;height:56px;border-radius:18px;margin:0 auto 12px;display:grid;place-items:center;color:#fff;box-shadow:inset 0 2px 0 rgba(255,255,255,.55),inset 0 -3px 0 rgba(0,0,0,.3),0 10px 22px rgba(0,0,0,.4)}
.type .ic svg{width:28px;height:28px}
.type.room .ic{background:linear-gradient(160deg,#a78bfa,#6d28d9)}
.type.tv .ic{background:linear-gradient(160deg,#67e8f9,#0284c7)}
.type.whiteboard .ic{background:linear-gradient(160deg,#fde68a,#f97316)}
.type b{display:block;font-size:16px;font-weight:900}
.type small{display:block;color:var(--faint);font-size:11px;margin-top:3px;font-weight:700}

.purposes{display:grid;gap:10px}
.purpose{display:flex;align-items:center;gap:14px;padding:16px 16px;border-radius:20px;text-align:left;overflow:hidden}
.purpose::before{content:'';position:absolute;left:0;top:0;bottom:0;width:7px}
.purpose.contact::before{background:linear-gradient(180deg,var(--contact1),var(--contact2));box-shadow:0 0 16px var(--contact2)}
.purpose.new::before{background:linear-gradient(180deg,var(--new1),var(--new2));box-shadow:0 0 16px var(--new2)}
.purpose.other::before{background:linear-gradient(180deg,var(--other1),var(--other2));box-shadow:0 0 16px var(--other2)}
.purpose .num{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:900;font-size:16px;background:rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -2px 0 rgba(0,0,0,.3);flex:none}
.purpose b{display:block;font-size:19px;font-weight:900}
.purpose small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.purpose .rank{margin-left:auto;flex:none;font-size:10.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border-radius:99px;background:rgba(255,255,255,.12);border:1px solid var(--line)}
.purpose.contact .rank{background:linear-gradient(160deg,var(--contact1),var(--contact2));border-color:transparent;color:#fff}
.purpose.new .rank{background:linear-gradient(160deg,var(--new1),var(--new2));border-color:transparent;color:#032535}
.otherbox{margin-top:10px;display:grid;gap:10px;animation:stepIn .4s var(--spring) both}
.field{width:100%;padding:15px 16px;border-radius:16px;background:rgba(0,0,0,.28);border:1px solid var(--line);box-shadow:inset 0 2px 6px rgba(0,0,0,.4);font-size:16px;color:#fff}
.field::placeholder{color:var(--faint)}

.group{margin:0 0 14px}
.group h4{margin:0 0 8px;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (min-width:480px){.chips{grid-template-columns:repeat(4,1fr)}}
.chip{padding:13px 4px;border-radius:14px;font-weight:800;font-size:15px;text-align:center;font-variant-numeric:tabular-nums;animation:rise .5s var(--spring) both}
.chip.on{background:linear-gradient(135deg,var(--cta1),var(--cta2));border-color:transparent}
.chip small{display:block;font-size:10px;font-weight:700;color:var(--faint);margin-top:2px}
.empty{padding:22px;border-radius:18px;background:rgba(255,255,255,.06);border:1px dashed var(--line);text-align:center;color:var(--muted)}

.summary{position:relative;border-radius:22px;padding:18px;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 16px 40px rgba(0,0,0,.4)}
.summary .ribbon{position:absolute;right:-34px;top:16px;transform:rotate(38deg);padding:5px 44px;font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.summary .ribbon.contact{background:linear-gradient(90deg,var(--contact1),var(--contact2))}
.summary .ribbon.new{background:linear-gradient(90deg,var(--new1),var(--new2));color:#032535}
.summary .ribbon.other{background:linear-gradient(90deg,var(--other1),var(--other2));color:#2a1200}
.summary .big{font-size:30px;font-weight:900;letter-spacing:-.03em;line-height:1.05;margin:0 0 4px}
.summary .row{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:14px;margin-top:8px}
.summary .row b{color:#fff}
.summary .row svg{width:16px;height:16px;flex:none;opacity:.8}
.namewrap{margin:14px 0 16px}
.namewrap label{display:block;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.confirm{width:100%;padding:19px;border-radius:999px;font-size:19px;font-weight:900;color:#fff;background:linear-gradient(135deg,var(--cta1),var(--cta2));box-shadow:inset 0 2px 0 rgba(255,255,255,.5),inset 0 -5px 0 rgba(120,0,40,.4),0 16px 36px rgba(255,61,129,.45);transition:transform .14s var(--spring),box-shadow .14s}
.confirm:active{transform:translateY(4px);box-shadow:inset 0 2px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(120,0,40,.4),0 4px 10px rgba(255,61,129,.3)}
.confirm[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.ghost{width:100%;padding:16px;border-radius:999px;font-size:16px;font-weight:800;color:#fff;margin-top:10px;background:rgba(255,255,255,.1);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}

.done{text-align:center;padding:6px 0 4px}
.done .ring{width:96px;height:96px;border-radius:50%;margin:8px auto 18px;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,#34d399,#059669);box-shadow:inset 0 3px 0 rgba(255,255,255,.55),inset 0 -5px 0 rgba(0,0,0,.3),0 0 0 12px rgba(52,211,153,.18),0 20px 50px rgba(52,211,153,.45);animation:pop .9s var(--spring) both}
.done .ring svg{width:46px;height:46px;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .6s .35s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.done h3{margin:0 0 6px}
.done p{color:var(--muted);margin:0 0 18px;font-size:15px}
.done p b{color:#fff}

@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.15s!important}.cta-float{animation:none}.orb{animation:none}}
</style>
</head>
<body>
<div class="sky"><div class="orb a"></div><div class="orb b"></div><div class="orb c"></div><div class="orb d"></div></div>
<div class="grain"></div>

<main class="app">
  <header class="rise">
    <div class="brand"><span class="dot"></span>LV Zion</div>
    <h1>Study <em>Rooms</em></h1>
    <p class="sub">Every room, every half hour, the whole day.</p>
    <div class="days" id="days" role="tablist" aria-label="Day"></div>
  </header>

  <section class="toggles rise" id="toggles" style="animation-delay:.08s" role="tablist" aria-label="What to show"></section>

  <section class="panel rise" style="animation-delay:.16s">
    <div class="sched-head">
      <h2 id="schedTitle"></h2>
      <div class="legend"><span><i class="c"></i>Contact</span><span><i class="n"></i>New Member</span><span><i class="o"></i>Other</span><span><i class="a"></i>Available</span><span><i class="s"></i>Service</span></div>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</main>

<div class="cta-wrap"><div class="cta-float"><button class="cta" id="reserveBtn" aria-haspopup="dialog"><span class="plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>Reserve Now</button></div></div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="stepTitle" hidden>
  <div class="grip"></div>
  <div class="sheet-top">
    <button class="nav" id="back" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="dots" id="dots" aria-hidden="true"></div>
    <button class="nav" id="close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="crumbs" id="crumbs"></div>
  <div id="stepBody"></div>
</div>

<script>
/* ================= data (mirrors the live scheduler's units, purposes and service times) ================= */
const DAY_START=600, DAY_END=1380, STEP=30, SLOTS=(DAY_END-DAY_START)/STEP, ROW=44;
const ICON={
  room:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h10v18H5z"/><path d="M15 5l4-1v17l-4-1"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>',
  tv:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2.5"/><path d="M8 21h8M12 16v5"/></svg>',
  whiteboard:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="13" rx="2.5"/><path d="M7 16v5M17 16v5M7 11l3-3 3 3 4-4"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>'
};
const TYPES={
  room:{key:'room',label:'Rooms',one:'Room',ask:'room',units:[
    {id:'room-1',short:'Room 1',name:'Study Room 1'},{id:'room-2',short:'Room 2',name:'Study Room 2'},
    {id:'room-3',short:'Room 3',name:'Study Room 3'},{id:'room-4',short:'Room 4',name:'Study Room 4'}]},
  whiteboard:{key:'whiteboard',label:'Whiteboards',one:'Whiteboard',ask:'whiteboard',units:[
    {id:'wb-1',short:'WB 1',sub:'Large',name:'Whiteboard 1 (Large)'},{id:'wb-2',short:'WB 2',sub:'Large',name:'Whiteboard 2 (Large)'},
    {id:'wb-3',short:'WB 3',sub:'Large',name:'Whiteboard 3 (Large)'},{id:'wb-4',short:'WB 4',sub:'Vertical',name:'Whiteboard 4 (Vertical)'},
    {id:'wb-5',short:'WB 5',sub:'Vertical',name:'Whiteboard 5 (Vertical)'}]},
  tv:{key:'tv',label:'TVs',one:'TV',ask:'TV',units:[
    {id:'tv-1',short:'TV 1',name:'TV 1'},{id:'tv-2',short:'TV 2',name:'TV 2'},{id:'tv-3',short:'TV 3',name:'TV 3'}]}
};
const PURPOSES={
  contact:{key:'contact',label:'Contact',rank:'1st priority',blurb:'Comes first. Can take a time held for Other.'},
  new:{key:'new',label:'New Member',rank:'2nd priority',blurb:'Comes second. Can also take a time held for Other.'},
  other:{key:'other',label:'Other',rank:'Last priority',blurb:'Tell us what it is for.'}
};
/* service blocks by weekday: Saturday holds three services, Tuesday only the evening one */
const SERVICES={6:[[600,660,'Morning service'],[870,930,'Afternoon service'],[1170,1230,'Evening service']],2:[[1170,1230,'Evening service']]};
const WINDOWS={6:[[660,870,'Late morning'],[930,1170,'Afternoon and evening'],[1230,1380,'Late evening']],2:[[600,1170,'Daytime and evening'],[1230,1380,'Late evening']]};

function nextDay(dow){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+((dow-d.getDay()+7)%7));return d;}
const DAYS=[nextDay(2),nextDay(6)].sort((a,b)=>a-b).map(d=>({date:d,dow:d.getDay(),key:d.getDay()===6?'sat':'tue',
  name:d.toLocaleDateString('en-US',{weekday:'long'}),short:d.toLocaleDateString('en-US',{weekday:'short'}),
  md:d.toLocaleDateString('en-US',{month:'short',day:'numeric'}),today:d.getTime()===new Date().setHours(0,0,0,0)}));

/* demo reservations: what a realistic day looks like */
let BOOKINGS=[
  {day:'sat',type:'room',unit:'room-1',start:660,end:780,name:'Elena M.',purpose:'contact'},
  {day:'sat',type:'room',unit:'room-1',start:1350,end:1380,name:'Samuel D.',purpose:'other',note:'Review meeting'},
  {day:'sat',type:'room',unit:'room-2',start:690,end:750,name:'Isaac V.',purpose:'other',note:'Catching up'},
  {day:'sat',type:'room',unit:'room-2',start:960,end:1050,name:'Jordan A.',purpose:'new'},
  {day:'sat',type:'room',unit:'room-3',start:660,end:750,name:'Grace L.',purpose:'new'},
  {day:'sat',type:'room',unit:'room-3',start:1050,end:1140,name:'Anthony',purpose:'other',note:'Family Bible study'},
  {day:'sat',type:'room',unit:'room-4',start:930,end:990,name:'Maria R.',purpose:'contact'},
  {day:'sat',type:'room',unit:'room-4',start:1230,end:1320,name:'Noah P.',purpose:'other',note:'Review'},
  {day:'sat',type:'tv',unit:'tv-1',start:960,end:1050,name:'Micah S.',purpose:'other',note:'Video lesson'},
  {day:'sat',type:'tv',unit:'tv-2',start:720,end:780,name:'Maria R.',purpose:'new'},
  {day:'sat',type:'whiteboard',unit:'wb-1',start:660,end:720,name:'Daniel K.',purpose:'other',note:'Planning'},
  {day:'sat',type:'whiteboard',unit:'wb-2',start:1050,end:1140,name:'Hannah C.',purpose:'contact'},
  {day:'tue',type:'room',unit:'room-4',start:600,end:810,name:'Anthony',purpose:'contact'},
  {day:'tue',type:'room',unit:'room-2',start:660,end:690,name:'Taylor B.',purpose:'other',note:'Catching up'},
  {day:'tue',type:'room',unit:'room-1',start:1080,end:1140,name:'Sofia M.',purpose:'other',note:'Family Bible study'},
  {day:'tue',type:'room',unit:'room-3',start:1230,end:1290,name:'Grace L.',purpose:'new'},
  {day:'tue',type:'tv',unit:'tv-1',start:840,end:900,name:'Maria R.',purpose:'new'},
  {day:'tue',type:'whiteboard',unit:'wb-1',start:960,end:1050,name:'Daniel K.',purpose:'other',note:'Planning'}
].map((b,i)=>Object.assign(b,{id:'b'+i}));

/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(min){const h=Math.floor(min/60),m=min%60;return (((h+11)%12)+1)+':'+String(m).padStart(2,'0')+' '+(h<12?'AM':'PM');}
function fmtShort(min){const h=Math.floor(min/60);return (((h+11)%12)+1)+(h<12?' AM':' PM');}
function fmtRange(a,b){return fmt(a)+' to '+fmt(b);}
function fmtC(min){const h=Math.floor(min/60),m=min%60;return (((h+11)%12)+1)+(m?':'+String(m).padStart(2,'0'):'')+(h<12?' am':' pm');}
function dur(a,b){const m=b-a,h=Math.floor(m/60),r=m%60;return (h?h+'h':'')+(r?(h?' ':'')+r+'m':'');}
const slotMin=s=>DAY_START+s*STEP;
const minSlot=m=>(m-DAY_START)/STEP;
function services(day){return SERVICES[day.dow]||[];}
function isService(day,slot){const m=slotMin(slot);return services(day).some(([a,b])=>m>=a&&m<b);}
function occupant(day,type,unit,slot){const m=slotMin(slot);return BOOKINGS.find(b=>b.day===day.key&&b.type===type&&b.unit===unit&&m>=b.start&&m<b.end);}
function isFree(day,type,unit,slot){return slot<SLOTS&&!isService(day,slot)&&!occupant(day,type,unit,slot);}
function freeRun(day,type,unit,from){let n=0;while(isFree(day,type,unit,from+n))n++;return n;}
function anyFree(day,type,slot){return TYPES[type].units.some(u=>isFree(day,type,u.id,slot));}
function maxRun(day,type,from){return Math.max(0,...TYPES[type].units.map(u=>freeRun(day,type,u.id,from)));}
function pickUnit(day,type,from,n){let best=null;TYPES[type].units.forEach(u=>{const r=freeRun(day,type,u.id,from);if(r>=n&&(!best||r<best.r))best={u,r};});return best?best.u:null;}
function nowMin(){const d=new Date();return d.getHours()*60+d.getMinutes();}
function refSlot(day){if(day.today){const m=nowMin();if(m>=DAY_START&&m<DAY_END)return Math.floor((m-DAY_START)/STEP);}let s=0;while(s<SLOTS&&isService(day,s))s++;return s;}

/* ================= state ================= */
const S={dayIdx:0,type:'room',open:false,step:0,dir:1,draft:{}};
(function(){const t=DAYS.findIndex(d=>d.today);if(t>=0)S.dayIdx=t;})();
let savedName='';try{savedName=localStorage.getItem('lvrooms-proto-name')||'';}catch(e){}

/* ================= main screen ================= */
function renderDays(){
  $('#days').innerHTML=DAYS.map((d,i)=>`<button role="tab" aria-selected="${i===S.dayIdx}" class="${i===S.dayIdx?'on':''}" data-i="${i}">${d.short} ${d.md}<span>${d.today?'Today':d.name}</span></button>`).join('');
}
function renderToggles(){
  const day=DAYS[S.dayIdx],ref=refSlot(day),label=day.today&&ref===Math.floor((nowMin()-DAY_START)/STEP)&&nowMin()>=DAY_START&&nowMin()<DAY_END?'free right now':'free at '+fmt(slotMin(ref));
  $('#toggles').innerHTML=Object.values(TYPES).map(t=>{
    const free=t.units.filter(u=>isFree(day,t.key,u.id,ref)).length;
    return `<button role="tab" aria-selected="${S.type===t.key}" class="key tile ${t.key} ${S.type===t.key?'on':''}" data-type="${t.key}"><span class="ic">${ICON[t.key]}</span><span class="nm">${t.label}</span><b>${free}<i>of ${t.units.length}</i></b><small>${label}</small></button>`;
  }).join('');
}
function block(b,s,n){
  const p=PURPOSES[b.purpose];
  return `<div class="blk res ${b.purpose}" data-id="${b.id}" style="top:${s*ROW+2}px;height:${n*ROW-4}px" title="${esc(b.name)} · ${p.label}${b.note?' · '+esc(b.note):''} · ${fmtRange(b.start,b.end)}"><span class="tag">${p.label}</span><span class="who">${esc(b.name)}</span>${n>=2?`<span class="when">${fmtC(b.start)} to ${fmtC(b.end)}</span>`:''}${n>=3&&b.note?`<span class="when">${esc(b.note)}</span>`:''}</div>`;
}
function availBlock(s,n){
  const a=slotMin(s),b=slotMin(s+n);
  return `<button class="blk avail" data-start="${s}" aria-label="Available ${fmtRange(a,b)}, tap to reserve" style="top:${s*ROW+2}px;height:${n*ROW-4}px"><span class="tag">Open</span>${n>=2?`<span class="when">${fmtC(a)} to ${fmtC(b)}</span>`:''}</button>`;
}
function renderGrid(){
  const day=DAYS[S.dayIdx],t=TYPES[S.type],units=t.units,grid=$('#grid');
  grid.style.setProperty('--n',units.length);grid.classList.toggle('dense',units.length>=5);grid.classList.add('wide');
  $('#schedTitle').innerHTML=`${t.label} <span>· ${day.name}, ${day.md}</span>`;
  const head=`<div class="g-head"><div></div>${units.map(u=>`<div class="unit"><b>${u.short}</b>${u.sub?`<i>${u.sub}</i>`:''}</div>`).join('')}</div>`;
  let gut='';for(let s=0;s<=SLOTS;s+=2)gut+=`<div class="tl" style="top:${s*ROW}px">${fmtShort(slotMin(s))}</div>`;
  const cols=units.map(u=>{
    let html='',s=0;
    while(s<SLOTS){
      if(isService(day,s)){s++;continue;}
      const b=occupant(day,t.key,u.id,s);
      if(b){const n=(b.end-b.start)/STEP;html+=block(b,s,n);s+=n;continue;}
      const n=freeRun(day,t.key,u.id,s);html+=availBlock(s,n);s+=n;
    }
    return `<div class="col">${html}</div>`;
  }).join('');
  const bands=services(day).map(([a,b,l])=>`<div class="band" style="top:${minSlot(a)*ROW}px;height:${(b-a)/STEP*ROW}px"><span>${l}</span></div>`).join('');
  let now='';if(day.today){const m=nowMin();if(m>=DAY_START&&m<=DAY_END)now=`<div class="now" style="top:${(m-DAY_START)/STEP*ROW}px"><i></i></div>`;}
  grid.innerHTML=head+`<div class="g-body" style="height:${SLOTS*ROW}px">${bands}<div class="g-gut">${gut}</div>${cols}${now}</div>`;
}
function renderMain(){renderDays();renderToggles();renderGrid();}

/* ================= reservation flow ================= */
const STEPS=5; /* type, purpose, start, end, confirm (done is after) */
function openSheet(preset){
  S.draft={type:preset&&preset.type||null,purpose:null,note:'',start:preset&&preset.start!=null?preset.start:null,end:null,name:savedName};
  S.step=preset&&preset.type?1:0;S.dir=1;S.open=true;
  $('#sheet').hidden=false;requestAnimationFrame(()=>{$('#scrim').classList.add('on');$('#sheet').classList.add('on');});
  renderStep();
}
function closeSheet(){S.open=false;$('#scrim').classList.remove('on');$('#sheet').classList.remove('on');setTimeout(()=>{if(!S.open)$('#sheet').hidden=true;},600);}
function go(n){S.dir=n>S.step?1:-1;S.step=n;renderStep();$('#sheet').scrollTo({top:0,behavior:'smooth'});}
function crumbs(){
  const d=S.draft,day=DAYS[S.dayIdx],out=[`<span class="crumb">${day.short} ${day.md}</span>`];
  if(d.type)out.push(`<span class="crumb">${TYPES[d.type].one}</span>`);
  if(d.purpose)out.push(`<span class="crumb ${d.purpose}">${PURPOSES[d.purpose].label}${d.purpose==='other'&&d.note?': '+esc(d.note):''}</span>`);
  if(d.start!=null)out.push(`<span class="crumb">${fmt(slotMin(d.start))}${d.end!=null?' to '+fmt(slotMin(d.end)):''}</span>`);
  return out.join('');
}
function renderStep(){
  const d=S.draft,day=DAYS[S.dayIdx],st=S.step,body=$('#stepBody');
  $('#dots').innerHTML=Array.from({length:STEPS},(_,i)=>`<i class="${i<st?'done':i===st?'on':''}"></i>`).join('');
  $('#back').hidden=st===0||st===5;$('#crumbs').innerHTML=st===5?'':crumbs();
  const cls='step'+(S.dir<0?' back':'');
  let h='';
  if(st===0){
    h=`<div class="${cls}"><h3 id="stepTitle">What would you like to reserve?</h3><p class="hint">Pick one. Your time is held only for that.</p><div class="types">${Object.values(TYPES).map(t=>{
      return `<button class="key type ${t.key}" data-type="${t.key}"><span class="ic">${ICON[t.key]}</span><b>${t.one}</b><small>${t.units.filter(u=>isFree(day,t.key,u.id,refSlot(day))).length} of ${t.units.length} open now</small></button>`;}).join('')}</div></div>`;
  } else if(st===1){
    const t=TYPES[d.type];
    h=`<div class="${cls}"><h3 id="stepTitle">What is the ${t.ask} for?</h3><p class="hint">Contact and New Member come first.</p><div class="purposes">${Object.values(PURPOSES).map((p,i)=>`<button class="key purpose ${p.key} ${d.purpose===p.key?'pressed':''}" data-purpose="${p.key}"><span class="num">${i+1}</span><span><b>${p.label}</b><small>${p.blurb}</small></span><span class="rank">${p.rank}</span></button>`).join('')}</div>
      <div id="otherbox" class="otherbox" ${d.purpose==='other'?'':'hidden'}><input class="field" id="noteField" maxlength="40" placeholder="What is it for? (example: Family Bible study)" value="${esc(d.note)}" autocomplete="off"><button class="confirm" id="noteNext" ${d.note.trim()?'':'disabled'}>Continue</button></div></div>`;
  } else if(st===2){
    const groups=(WINDOWS[day.dow]||[]).map(([a,b,l])=>{const chips=[];for(let s=minSlot(a);s<minSlot(b);s++)if(anyFree(day,d.type,s))chips.push(s);return {l,chips};}).filter(g=>g.chips.length);
    h=`<div class="${cls}"><h3 id="stepTitle">When would you like to start?</h3><p class="hint">Only times with a ${TYPES[d.type].ask} still open are shown.</p>${groups.length?groups.map(g=>`<div class="group"><h4>${g.l}</h4><div class="chips">${g.chips.map((s,i)=>`<button class="key chip ${d.start===s?'on':''}" data-start="${s}" style="animation-delay:${Math.min(i*25,300)}ms">${fmt(slotMin(s))}</button>`).join('')}</div></div>`).join(''):`<div class="empty">Every ${TYPES[d.type].ask} is taken on ${day.name}. Try the other day.</div>`}</div>`;
  } else if(st===3){
    const run=maxRun(day,d.type,d.start),ends=[];for(let k=1;k<=run;k++)ends.push(d.start+k);
    h=`<div class="${cls}"><h3 id="stepTitle">When would you like to end?</h3><p class="hint">Starting ${fmt(slotMin(d.start))}. Up to ${dur(0,run*STEP)} is open.</p><div class="group"><div class="chips">${ends.map((s,i)=>`<button class="key chip ${d.end===s?'on':''}" data-end="${s}" style="animation-delay:${Math.min(i*25,300)}ms">${fmt(slotMin(s))}<small>${dur(0,(s-d.start)*STEP)}</small></button>`).join('')}</div></div></div>`;
  } else if(st===4){
    const unit=pickUnit(day,d.type,d.start,d.end-d.start),p=PURPOSES[d.purpose];
    h=`<div class="${cls}"><h3 id="stepTitle">Confirm your reservation</h3><p class="hint">Everything below is held for you once you confirm.</p>
      <div class="summary"><span class="ribbon ${d.purpose}">${p.label}</span><p class="big">${unit?esc(unit.name):TYPES[d.type].one}</p>
        <div class="row">${ICON.cal}<span><b>${day.name}</b>, ${day.md}</span></div>
        <div class="row">${ICON.clock}<span><b>${fmtRange(slotMin(d.start),slotMin(d.end))}</b> · ${dur(slotMin(d.start),slotMin(d.end))}</span></div>
        <div class="row">${ICON.pin}<span>${p.label}${d.purpose==='other'&&d.note?' · <b>'+esc(d.note)+'</b>':''}</span></div></div>
      <div class="namewrap"><label for="nameField">Your name</label><input class="field" id="nameField" maxlength="40" placeholder="Who is this for?" value="${esc(d.name)}" autocomplete="name"></div>
      <button class="confirm" id="confirmBtn" ${d.name.trim()?'':'disabled'}>Confirm reservation</button></div>`;
  } else {
    const b=d.saved,p=PURPOSES[b.purpose],unit=TYPES[b.type].units.find(u=>u.id===b.unit);
    h=`<div class="${cls} done"><div class="ring">${ICON.check}</div><h3 id="stepTitle">You're all set</h3><p><b>${esc(unit.name)}</b> is yours on <b>${day.name}, ${day.md}</b><br>${fmtRange(b.start,b.end)} · ${p.label}${b.note?' · '+esc(b.note):''}</p><button class="confirm" id="seeIt">See it on the schedule</button><button class="ghost" id="another">Reserve something else</button></div>`;
  }
  body.innerHTML=h;
  const f=body.querySelector('#noteField,#nameField');if(f&&st!==1)setTimeout(()=>f.focus(),350);
}

/* ================= events ================= */
$('#days').addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(!b)return;S.dayIdx=+b.dataset.i;renderMain();});
$('#toggles').addEventListener('click',e=>{const b=e.target.closest('button[data-type]');if(!b)return;S.type=b.dataset.type;renderToggles();renderGrid();});
$('#grid').addEventListener('click',e=>{const b=e.target.closest('.blk.avail');if(!b)return;openSheet({type:S.type,start:+b.dataset.start});});
$('#reserveBtn').addEventListener('click',()=>openSheet());
$('#scrim').addEventListener('click',closeSheet);
$('#close').addEventListener('click',closeSheet);
$('#back').addEventListener('click',()=>{const d=S.draft;if(S.step===3)d.end=null;if(S.step===2)d.start=null;if(S.step===1)d.purpose=null;go(S.step-1);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.open)closeSheet();});
$('#stepBody').addEventListener('click',e=>{
  const d=S.draft,day=DAYS[S.dayIdx];
  const t=e.target.closest('[data-type]');if(t){d.type=t.dataset.type;S.type=d.type;renderToggles();renderGrid();return go(1);}
  const p=e.target.closest('[data-purpose]');if(p){d.purpose=p.dataset.purpose;if(d.purpose==='other'){renderStep();setTimeout(()=>{const f=$('#noteField');if(f)f.focus();},50);return;}d.note='';return go(d.start!=null?3:2);}
  if(e.target.closest('#noteNext')){d.note=($('#noteField').value||'').trim();if(!d.note)return;return go(d.start!=null?3:2);}
  const s=e.target.closest('[data-start]');if(s){d.start=+s.dataset.start;d.end=null;s.classList.add('on');return setTimeout(()=>go(3),140);}
  const en=e.target.closest('[data-end]');if(en){d.end=+en.dataset.end;en.classList.add('on');return setTimeout(()=>go(4),140);}
  if(e.target.closest('#confirmBtn')){
    d.name=($('#nameField').value||'').trim();if(!d.name)return;
    const unit=pickUnit(day,d.type,d.start,d.end-d.start);if(!unit){go(2);return;}
    const b={id:'b'+Date.now(),day:day.key,type:d.type,unit:unit.id,start:slotMin(d.start),end:slotMin(d.end),name:d.name,purpose:d.purpose,note:d.note};
    BOOKINGS.push(b);d.saved=b;savedName=d.name;try{localStorage.setItem('lvrooms-proto-name',savedName);}catch(err){}
    S.type=d.type;renderToggles();renderGrid();const el=document.querySelector(`[data-id="${b.id}"]`);if(el)el.classList.add('pop');
    return go(5);
  }
  if(e.target.closest('#seeIt')){closeSheet();const el=document.querySelector(`[data-id="${d.saved.id}"]`);if(el){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');el.scrollIntoView({behavior:'smooth',block:'center'});}return;}
  if(e.target.closest('#another')){openSheet();}
});
$('#stepBody').addEventListener('input',e=>{
  if(e.target.id==='noteField'){S.draft.note=e.target.value;$('#noteNext').disabled=!e.target.value.trim();}
  if(e.target.id==='nameField'){S.draft.name=e.target.value;$('#confirmBtn').disabled=!e.target.value.trim();}
});
$('#stepBody').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='noteField'||e.target.id==='nameField')){const b=$(e.target.id==='noteField'?'#noteNext':'#confirmBtn');if(b&&!b.disabled)b.click();}});

renderMain();
setInterval(()=>{if(!S.open){renderToggles();renderGrid();}},60000);
</script>
</body>
</html>
