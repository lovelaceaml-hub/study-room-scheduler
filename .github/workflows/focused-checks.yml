# Focused checks: the only tests that start by themselves. They run on pull
# requests (Dependabot's included) unless only documents changed, take well under
# a minute, need no install and use no secrets. They do NOT test booking, the
# pages or the database, so a pass here is not a full test pass. The full suites
# are in "Tests" (tests.yml) and need Anthony's approval for each run.
name: Focused checks

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: focused-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: The deploy guard refuses forbidden targets
        run: bash .github/scripts/deploy-guard.sh --self-test
      - name: The backend guard accepts main and refuses what it should
        run: node --test test/backend-guard.test.mjs
      - name: Every JavaScript file parses
        run: find functions public .github/scripts test \( -name '*.js' -o -name '*.mjs' \) -not -path '*/node_modules/*' -print0 | xargs -0 -n1 node --check
