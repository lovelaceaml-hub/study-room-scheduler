# Full suites run only on manual dispatch with explicit approval for this run.
# Automatic runs retain focused checks; a generic release request is not full-suite approval.
# Pull requests keep the deploy guard, Functions syntax and release-check fixtures.
# Manual runs add the broad suites only with full_suite_approved=true.
name: Tests

on:
  pull_request:
  workflow_dispatch:
    inputs:
      full_suite_approved:
        description: "Anthony explicitly requested or just approved the full suite for this run"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install test dependencies
        run: |
          npm ci
          npm ci --prefix functions
      - name: Install the Chromium browser for the tests
        run: npx playwright install --with-deps chromium
      - name: Focused deploy guard self-test
        run: bash .github/scripts/deploy-guard.sh --self-test
      - name: Rules, database actions, endpoints and browser/server agreement
        if: github.event_name == 'workflow_dispatch' && inputs.full_suite_approved
        run: npm test
      - name: App, Admin and TV in a real browser (fictional data, fake Firebase)
        if: github.event_name == 'workflow_dispatch' && inputs.full_suite_approved
        run: npm run test:browser

      - name: Read-only release checker against loopback fixtures
        run: npm run test:release-check

      - name: Report testing scope (authorization is not a pass)
        if: always()
        env:
          FULL_SUITE_APPROVED: ${{ github.event_name == 'workflow_dispatch' && inputs.full_suite_approved }}
        run: |
          if [ "$FULL_SUITE_APPROVED" = "true" ]; then
            echo "### Full-suite mode explicitly authorized" >> "$GITHUB_STEP_SUMMARY"
            echo "Authorization is not a pass: inspect every suite step's outcome. Skipped or failed suites are not passes." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Focused checks only: full suites NOT RUN" >> "$GITHUB_STEP_SUMMARY"
            echo "A successful job does not indicate a full-suite pass. Full suites require Anthony's explicit request or immediate approval for this run." >> "$GITHUB_STEP_SUMMARY"
          fi

  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install test dependencies
        run: npm ci --prefix functions
      - name: Focused Functions syntax check
        run: node --check functions/index.js
      - name: Browsers cannot read or write the database (Firestore emulator, demo project)
        if: github.event_name == 'workflow_dispatch' && inputs.full_suite_approved
        run: npm run test:rules

      - name: Report testing scope (authorization is not a pass)
        if: always()
        env:
          FULL_SUITE_APPROVED: ${{ github.event_name == 'workflow_dispatch' && inputs.full_suite_approved }}
        run: |
          if [ "$FULL_SUITE_APPROVED" = "true" ]; then
            echo "### Full-suite mode explicitly authorized" >> "$GITHUB_STEP_SUMMARY"
            echo "Authorization is not a pass: inspect every suite step's outcome. Skipped or failed suites are not passes." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Focused checks only: full suites NOT RUN" >> "$GITHUB_STEP_SUMMARY"
            echo "A successful job does not indicate a full-suite pass. Full suites require Anthony's explicit request or immediate approval for this run." >> "$GITHUB_STEP_SUMMARY"
          fi

