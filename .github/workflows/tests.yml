# Tests: every full test suite. It runs only when started by hand from the Actions
# tab with full_suite_approved ticked, and only when Anthony approved that exact
# run. It never starts on its own and it deploys nothing and uses no secrets.
# The automatic pull request check is "Focused checks" (focused-checks.yml).
# The Firestore rules test needs the emulator, so it runs in its own job.
name: Tests

on:
  workflow_dispatch:
    inputs:
      full_suite_approved:
        description: "Run the full test suites. Tick only when Anthony approved them for this run"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  not-approved:
    # A green run with every job skipped would look like a pass, so this fails.
    if: ${{ !inputs.full_suite_approved }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Nothing was tested
        run: |
          echo "::error::Nothing was tested. Tick full_suite_approved to run the full test suites."
          exit 1

  rules-and-browser:
    if: inputs.full_suite_approved
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install test dependencies
        run: |
          npm ci
          npm ci --prefix functions
      - name: Install the Chromium browser for the tests
        run: npx playwright install --with-deps chromium
      - name: Rules, database actions, endpoints and browser/server agreement
        run: npm test
      - name: App, Admin and TV in a real browser (fictional data, fake Firebase)
        run: npm run test:browser

      - name: Read-only release checker against loopback fixtures
        run: npm run test:release-check

  firestore-rules:
    if: inputs.full_suite_approved
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install test dependencies
        run: npm ci --prefix functions
      - name: Browsers cannot read or write the database (Firestore emulator, demo project)
        run: npm run test:rules
