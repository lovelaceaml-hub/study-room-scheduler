<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F4F0E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101713" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Choose your LV Zion Study Rooms design, then reserve a study room, whiteboard or TV.">
<title>LV Zion · Study Rooms</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  /* design-choice.js forwards to the remembered design, or paints the picker
     over this page. The only job here is a calm background instead of a white
     flash, plus a plain list of links when scripting is unavailable. */
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #f4f0e8;
    color: #2c3327;
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #101713; color: #e6ece3; }
  }
  .entry {
    box-sizing: border-box;
    max-width: 34rem;
    margin: 0 auto;
    padding: 40px 16px;
  }
  .entry h1 { font-size: 20px; margin: 0 0 8px; }
  .entry ul { padding-left: 20px; }
  .entry li { margin: 6px 0; }
  .entry a { color: inherit; }
</style>
</head>
<body>
<div class="entry">
  <h1>LV Zion Study Rooms</h1>
  <p id="entry-status" role="status">Opening your design.</p>
  <noscript>
    <p>This app needs JavaScript. Open one of the six designs directly:</p>
    <ul>
      <li><a href="/experiences/solace/">Solace (default)</a></li>
      <li><a href="/experiences/velum/">Velum</a></li>
      <li><a href="/experiences/cove/">Cove</a></li>
      <li><a href="/experiences/petal/">Petal</a></li>
      <li><a href="/experiences/atlas/">Atlas</a></li>
      <li><a href="/experiences/lattice/">Lattice</a></li>
    </ul>
    <p><a href="/tv.html?tv=1">Lobby schedule</a> · <a href="/admin/">Admin</a></p>
  </noscript>
</div>
<script src="design-choice.js" defer></script>
</body>
</html>
