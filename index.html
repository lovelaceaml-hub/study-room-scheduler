<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FBFCFE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>LV Zion · Study Rooms</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  /* =====================================================================
     LV Zion Study Rooms — v2 design
     Layout & typography: "Morning Chapel" direction (serif display
     headings, hairline rules, calm generous whitespace, timeline/list
     schedule). Color palette: "Clear Sky" direction (blue primary,
     green=confirmed, sky=tentative, amber=waiting-in-line).
     ===================================================================== */
  :root {
    --paper: #FBFCFE;
    --card: #FFFFFF;
    --line: #DCE4F0;
    --ink: #1B2333;
    --ink-soft: #5B6478;
    --ink-faint: #6F7B91;
    --primary: #2B4BC0;
    --primary-dark: #1E3A9E;
    --primary-tint: #EAEEFB;
    --sky: #7FA7F0;
    --sky-tint: #EAF1FE;
    --green: #188A5E;
    --green-tint: #E3F3EC;
    --amber: #E8A13C;
    --amber-tint: #FCF1DE;
    --danger: #C43D33;
    --danger-tint: #FBEAE7;
    --serif: 'Iowan Old Style', 'Palatino', Georgia, serif;
    --sans: 'Avenir Next', 'Segoe UI', system-ui, -apple-system, sans-serif;
    --r-sm: 6px; --r-md: 8px; --r-lg: 10px;
    --shadow: 0 1px 2px rgba(27,35,51,0.03), 0 8px 20px -14px rgba(27,35,51,0.16);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; animation: none !important; } }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100vh;
  }
  h1, h2, h3, h4 { font-family: var(--serif); font-weight: 600; margin: 0; color: var(--ink); }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px 90px; }
  a { color: var(--primary); }
  :focus-visible { outline: 2.5px solid var(--primary); outline-offset: 2px; }

  /* ---- header ---- */
  header {
    background: var(--card);
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 30;
    cursor: pointer;
  }
  header:focus-visible { outline-offset: -3px; }
  .head-in {
    max-width: 1100px; margin: 0 auto;
    display: flex; align-items: center; gap: 14px;
    padding: 14px 16px;
  }
  .head-brand { display: flex; flex-direction: column; }
  .head-title { font-family: var(--serif); font-size: 20px; line-height: 1.2; font-weight: 600; color: var(--ink); letter-spacing: 0.01em; }
  .head-date { font-size: 13px; line-height: 1.2; font-weight: 700; color: var(--primary); margin-top: 2px; }
  .sync-pill {
    margin-left: auto; font-size: 11px; font-weight: 700;
    padding: 5px 12px; border-radius: 999px; white-space: nowrap;
    background: var(--green-tint); color: var(--green);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .sync-pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--green); display: inline-block; }
  .sync-pill.off { background: var(--amber-tint); color: #8A5A12; }
  .sync-pill.off::before { background: var(--amber); }

  /* ---- pill tab bar ---- */
  nav {
    position: sticky; top: 70px; z-index: 29;
    background: linear-gradient(var(--paper) 75%, rgba(251,252,254,0));
    padding: 10px 0 12px;
  }
  .tabs {
    max-width: 1100px; margin: 0 auto; padding: 0 16px;
    display: flex; gap: 4px; overflow-x: auto; -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    background: #F1F4FB; border-radius: 999px; width: fit-content;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto;
    border: none; border-radius: 999px;
    background: transparent; color: var(--ink-soft);
    font: 600 14px var(--sans);
    padding: 9px 20px; cursor: pointer;
    transition: background .15s, color .15s;
    min-height: 44px;
  }
  .tab.active { background: var(--primary); color: #fff; box-shadow: 0 4px 10px -3px rgba(43,75,192,0.5); }

  /* ---- cards ---- */
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow);
    padding: 20px;
    margin: 0 0 16px;
  }
  .card h2 { font-size: 20px; margin: 0 0 10px; }
  .section-note { font-size: 13.5px; color: var(--ink-soft); margin: 0 0 12px; line-height: 1.5; }
  .ref-tag {
    display: inline-block; font-family: var(--sans); font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-faint);
    border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; margin-left: 8px; vertical-align: middle;
  }
  .ref-link { font-size: 13px; color: var(--ink-faint); text-decoration: underline; text-underline-offset: 2px; }

  /* ---- buttons ---- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: 1px solid var(--line); border-radius: var(--r-md);
    background: var(--card); color: var(--ink);
    font: 600 15px var(--sans);
    padding: 10px 16px; cursor: pointer;
    transition: filter .15s, background .15s;
    text-decoration: none;
    min-height: 44px;
  }
  .btn:active { filter: brightness(0.96); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover { background: var(--primary-dark); }
  .btn.big { width: 100%; padding: 15px 16px; font-size: 16.5px; border-radius: 999px; font-weight: 700; box-shadow: 0 10px 22px -10px rgba(43,75,192,0.55); }
  .btn.danger { background: var(--danger-tint); border-color: var(--danger-tint); color: var(--danger); }
  .btn.ok { background: var(--green-tint); border-color: var(--green-tint); color: var(--green); }
  .btn.small { font-size: 13px; padding: 7px 13px; min-height: 44px; border-radius: 999px; }
  .btn[disabled] { opacity: 0.5; cursor: default; }

  /* ---- banner ---- */
  #banners:empty { display: none; }
  .banner {
    border-radius: var(--r-md); padding: 12px 14px; margin: 14px 0 0;
    font-size: 14px; background: var(--primary-tint); color: var(--primary-dark);
    border: 1px solid var(--line);
  }
  .banner.error { background: var(--danger-tint); color: var(--danger); border-color: var(--danger); }

  /* ---- forms ---- */
  input[type="text"], input[type="password"], select {
    width: 100%; border: 1px solid var(--line); border-radius: var(--r-md);
    background: var(--paper); color: var(--ink);
    font: 500 15px var(--sans); padding: 12px 13px;
    outline: none; min-height: 44px;
  }
  input:focus, select:focus { border-color: var(--primary); background: #fff; }
  .fld { display: block; font-size: 12.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-soft); margin: 18px 0 8px; font-family: var(--sans); }
  .fld:first-of-type { margin-top: 0; }
  .sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  .pin-row { display: flex; gap: 10px; }
  .pin-row input { text-align: center; font-size: 22px; letter-spacing: 8px; font-weight: 700; }
  .hint { font-size: 13px; color: var(--ink-soft); margin: 8px 0 0; }
  .pin-error { color: var(--danger); font-size: 13.5px; font-weight: 600; margin: 8px 0 0; }
  .lock-title { font-family: var(--serif); font-size: 19px; font-weight: 600; margin-bottom: 4px; }
  .muted { color: var(--ink-faint); }

  /* ---- pill chip buttons (needs / purpose / preferred room) ---- */
  .need-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .need-chip, .pref-chip, .purpose-chip, .unit-pill {
    font: 600 13.5px var(--sans); padding: 10px 15px; border-radius: 999px;
    border: 1.5px solid var(--line); color: var(--ink-soft); background: #fff;
    cursor: pointer; min-height: 44px;
  }
  .need-chip.active, .pref-chip.active, .purpose-chip.active {
    background: var(--primary); border-color: var(--primary); color: #fff;
    box-shadow: 0 4px 10px -4px rgba(43,75,192,0.5);
  }
  .unit-pill { font-size: 12.5px; padding: 7px 12px; min-height: 44px; }
  .unit-pill.active { background: var(--primary); border-color: var(--primary); color: #fff; }
  .unit-pill.disabled, .unit-pill[disabled] { background: #F1F3F7; color: var(--ink-faint); border-color: var(--line); cursor: default; text-decoration: line-through; }
  .assign-row { margin: 10px 0; }
  .assign-type-label { font-size: 12px; font-weight: 700; color: var(--ink-soft); display: block; margin-bottom: 6px; }
  .assign-ui { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }

  /* ---- shared Tuesday / Saturday selector ---- */
  .date-selector { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 12px 0 4px; }
  .date-choice {
    min-height: 64px; border: 2px solid var(--line); border-radius: var(--r-lg); padding: 10px 12px;
    background: #fff; color: var(--ink); cursor: pointer; font-family: var(--sans); text-align: left;
    display: flex; flex-direction: column; justify-content: center;
  }
  .date-choice.tuesday { border-color: #8AA5E8; background: #F1F5FF; }
  .date-choice.saturday { border-color: #D7A654; background: #FFF8E9; }
  .date-choice.active { color: #fff; box-shadow: 0 5px 12px -6px rgba(27,35,51,.55); }
  .date-choice.tuesday.active { background: var(--primary); border-color: var(--primary); }
  .date-choice.saturday.active { background: #8A5A12; border-color: #8A5A12; }
  .date-choice-day { font-size: 14px; font-weight: 800; }
  .date-choice-date { font-size: 12px; font-weight: 650; opacity: .9; }

  /* ---- time picker ---- */
  .strip-wrap { background: #F7F9FD; border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px; margin-bottom: 10px; }
  .strip-window-label { font-size: 12px; font-weight: 700; color: var(--ink-soft); margin-bottom: 8px; }
  .time-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(52px, 1fr)); gap: 5px; }
  .slot {
    flex: 1 0 44px; min-width: 44px; min-height: 44px; text-align: center; font-size: 11px; font-weight: 700;
    font-family: var(--sans); color: var(--ink-faint); background: #fff; border: 1px solid var(--line); border-radius: var(--r-sm);
    display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;
  }
  .slot.sel { background: var(--sky); color: #fff; border-color: var(--sky); }
  .slot.sel.start, .slot.sel.end { background: var(--primary); border-color: var(--primary); color: #fff; }
  .slot.blocked { background: #F1F3F7; color: var(--ink-faint); border-style: dashed; cursor: not-allowed; text-decoration: line-through; }
  .selection-summary { margin: 10px 0 0; padding: 10px 12px; background: var(--primary-tint); color: var(--primary-dark); border-radius: var(--r-md); font-weight: 800; font-size: 13.5px; }
  .service-notices { display: grid; gap: 7px; margin: 0 0 12px; }
  .service-notice { display: flex; justify-content: space-between; gap: 12px; padding: 9px 11px; border: 1px dashed #8A5A12; border-radius: var(--r-md); background: var(--amber-tint); color: #71470B; font-size: 12px; }
  .service-notice strong { white-space: nowrap; }

  /* ---- purpose / certainty ---- */
  .certainty-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .certainty-btn {
    flex: 1 1 200px; text-align: left; font-family: var(--sans); font-size: 14.5px; font-weight: 700;
    padding: 14px 16px; border-radius: var(--r-lg); border: 2px solid var(--line); background: #fff; color: var(--ink);
    cursor: pointer; min-height: 44px; line-height: 1.4;
  }
  .certainty-btn small { font-weight: 600; color: var(--ink-soft); }
  .certainty-btn.confirmed.active { background: var(--green-tint); border-color: var(--green); color: #0F5E40; }
  .certainty-btn.confirmed.active small { color: #0F5E40; }
  .certainty-btn.tentative.active { background: var(--sky-tint); border-color: var(--sky); color: var(--primary-dark); }
  .certainty-btn.tentative.active small { color: var(--primary-dark); }

  /* ---- certainty badges (used throughout) ---- */
  .badge-cert { display: inline-flex; align-items: center; justify-content: center; font-weight: 800; }
  .badge-cert.confirmed { color: var(--green); }
  .badge-cert.tentative { color: var(--sky); }

  /* ---- status badges ---- */
  .badge {
    display: inline-block; font-size: 11.5px; font-weight: 800;
    border-radius: 999px; padding: 3px 10px; vertical-align: 2px;
  }
  .status-approved { background: var(--green-tint); color: #0F5E40; }
  .status-pending { background: #E7EAF4; color: var(--ink-soft); }
  .status-declined { background: var(--danger-tint); color: var(--danger); }
  .status-cancelled { background: #F1F3F7; color: var(--ink-faint); }
  .status-waiting { background: var(--amber-tint); color: #8A5A12; }

  /* ---- request rows (My requests / pending queue / day list) ---- */
  .req-row { padding: 14px 0; border-top: 1px solid var(--line); }
  .req-row:first-of-type { border-top: none; }
  .req-head { display: flex; align-items: center; gap: 8px; font-size: 14.5px; font-weight: 700; flex-wrap: wrap; }
  .req-sub { font-size: 13px; color: var(--ink-soft); margin-top: 3px; }
  .req-actions { display: flex; gap: 10px; margin-top: 9px; flex-wrap: wrap; align-items: center; }
  .cancel-link { min-height: 44px; display: inline-flex; align-items: center; font-size: 12.5px; font-weight: 700; color: var(--primary); text-decoration: underline; text-underline-offset: 2px; }
  .conflict-note { background: var(--sky-tint); color: var(--primary-dark); border-radius: var(--r-md); padding: 9px 12px; font-size: 12.5px; font-weight: 600; margin: 8px 0 0; }

  /* ---- legend ---- */
  .legend { display: flex; gap: 18px; flex-wrap: wrap; margin: 0 0 16px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-soft); font-weight: 600; }
  .legend-swatch { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
  .legend-swatch.confirmed { background: var(--green); }
  .legend-swatch.tentative { background: #fff; border: 2px solid var(--sky); }
  .legend-swatch.requested { background: var(--amber-tint); border: 2px solid #A66B13; }
  .legend-swatch.waiting { background: var(--amber); }

  /* ---- schedule: category groups + hairline rules ---- */
  .cat-title {
    font-size: 12.5px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--ink-soft); margin: 16px 0 6px; font-family: var(--sans);
  }
  .cat-title:first-of-type { margin-top: 0; }
  .sched-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  /* ---- desktop timeline ---- */
  .sched-desktop { display: none; }
  .ruler-row, .timeline-row { display: flex; align-items: stretch; }
  .timeline-label {
    width: 132px; flex: 0 0 132px; display: flex; flex-direction: column; justify-content: center;
    font-size: 12px; font-weight: 700; color: var(--ink); padding-right: 8px; border-bottom: 1px solid transparent;
  }
  .timeline-label small { font-weight: 600; color: var(--ink-faint); font-size: 9.5px; margin-top: 0; }
  .ruler-track-wrap, .timeline-track-wrap { display: flex; flex: 1; gap: 3px; }
  .ruler { position: relative; height: 18px; }
  .ruler.morning { flex: 270 1 0; }
  .ruler.afternoon { flex: 210 1 0; }
  .ruler span { position: absolute; top: 0; font-size: 9px; font-weight: 700; color: var(--ink-faint); transform: translateX(-2px); white-space: nowrap; }
  .ruler-row { margin-bottom: 4px; }
  .timeline-row { margin-bottom: 4px; }
  .timeline-track {
    position: relative; height: 44px; border-radius: 7px;
    background-color: #F7F9FD; border: 1px solid var(--line);
  }
  .timeline-track.slot-grid { display: grid; overflow: hidden; }
  .calendar-cell {
    min-width: 0; min-height: 42px; border: 0; border-left: 1px solid var(--line);
    background: transparent; padding: 0; position: relative; z-index: 1;
  }
  .calendar-cell:first-child { border-left: 0; }
  button.calendar-cell.available { cursor: pointer; }
  button.calendar-cell.available:hover { background: var(--primary-tint); }
  button.calendar-cell.available:focus-visible { z-index: 4; outline-offset: -3px; background: var(--primary-tint); }
  .calendar-cell.occupied { background: #EEF1F6; }
  .service-track { background: repeating-linear-gradient(135deg, #F9EBCF 0, #F9EBCF 7px, #F4DDAF 7px, #F4DDAF 14px); border-color: #C58A2E; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .service-track > span { writing-mode: vertical-rl; font-size: 9px; font-weight: 800; color: #71470B; text-transform: uppercase; letter-spacing: .04em; }
  .service-ruler { background: var(--amber-tint); border-radius: 5px; overflow: hidden; }
  .service-ruler span { left: 50%; transform: translateX(-50%); color: #71470B; white-space: nowrap; font-size: 9px; }
  .timeline-track.morning { flex: 270 1 0; }
  .timeline-track.afternoon { flex: 210 1 0; }
  .chip {
    position: absolute; top: 3px; bottom: 3px; border-radius: 6px;
    padding: 3px 6px; display: flex; flex-direction: column; justify-content: center;
    font-size: 10.5px; overflow: hidden; min-width: 0; z-index: 3; pointer-events: none;
  }
  .chip-name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 4px; }
  .chip-time { font-size: 10px; font-weight: 600; opacity: 0.85; white-space: nowrap; }
  .chip-confirmed { background: var(--green-tint); border: 1.5px solid var(--green); color: #0F5E40; }
  .chip-tentative { background: var(--sky-tint); border: 1.5px dashed var(--sky); color: var(--primary-dark); }
  .chip-blocked { background: #F1F3F7; border: 1.5px dashed var(--ink-faint); color: var(--ink-soft); }
  .chip-podium {
    position: absolute; bottom: 4px; right: 6px; font-size: 9px; font-weight: 700; color: var(--primary);
    background: #fff; border-radius: 5px; padding: 1px 4px;
  }

  /* ---- waiting line strip ---- */
  .wait-strip {
    background: var(--amber-tint); border: 1.5px solid var(--amber); border-radius: var(--r-md);
    padding: 8px 12px; font-size: 12.5px; color: #8A5A12; font-weight: 600; margin-top: 8px;
  }
  .wait-time { font-weight: 800; margin-right: 6px; }
  .wait-label { font-weight: 800; margin-right: 4px; }
  .queue-num {
    display: inline-flex; align-items: center; justify-content: center; width: 15px; height: 15px;
    border-radius: 50%; background: var(--amber); color: #fff; font-size: 9.5px; font-weight: 800; margin-right: 3px;
  }
  .pending-lane { margin: 8px 0 12px; padding: 10px 12px; background: var(--amber-tint); border: 1.5px solid #B8791C; border-radius: var(--r-md); color: #71470B; }
  .pending-lane-title { font-size: 12px; font-weight: 850; text-transform: uppercase; letter-spacing: .035em; margin-bottom: 4px; }
  .pending-lane-item { display: grid; grid-template-columns: minmax(100px, 1fr) auto auto; gap: 10px; padding: 6px 0; border-top: 1px solid rgba(138,90,18,.2); font-size: 12px; align-items: center; }
  .pending-lane-item:first-of-type { border-top: 0; }
  .pending-name { font-weight: 800; color: #5F3A08; }

  /* ---- mobile schedule list ---- */
  .sched-mobile { display: block; }
  .mini-row { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .mini-row:first-of-type { border-top: none; }
  .mini-unit { font-weight: 700; width: 130px; flex: 0 0 130px; }
  .mini-detail { flex: 1; color: var(--ink); display: flex; align-items: center; gap: 5px; min-width: 0; }
  .mini-time { font-size: 11.5px; color: var(--ink-faint); flex: 0 0 auto; font-weight: 600; }
  .mini-reserved { color: var(--ink-faint); font-style: italic; }

  /* ---- member mobile time agenda ---- */
  .calendar-help { margin: 6px 0 12px; color: var(--ink-soft); font-size: 13px; font-weight: 650; }
  .mobile-agenda { margin-top: 14px; }
  .mobile-slot-row { padding: 10px 0; border-top: 1px solid var(--line); }
  .mobile-slot-time { font-size: 13px; font-weight: 800; color: var(--ink); margin-bottom: 7px; }
  .mobile-slot-resources { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .mobile-resource-btn {
    min-height: 50px; border: 1px solid var(--line); border-radius: var(--r-md); background: #fff;
    color: var(--ink); padding: 7px 5px; font: 700 11.5px var(--sans); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2;
  }
  .mobile-resource-btn small { display: block; margin-top: 3px; color: var(--green); font-size: 10px; font-weight: 750; }
  .mobile-resource-btn:active, .mobile-resource-btn:focus-visible { background: var(--primary-tint); border-color: var(--primary); }
  .mobile-resource-btn.full { background: #F1F3F7; color: var(--ink-faint); border-style: dashed; }
  .mobile-resource-btn.full small { color: var(--ink-faint); }
  .mobile-service-block {
    min-height: 58px; margin: 8px 0; padding: 9px 12px; border: 1px solid #C58A2E; border-radius: var(--r-md);
    background: repeating-linear-gradient(135deg, #F9EBCF 0, #F9EBCF 7px, #F4DDAF 7px, #F4DDAF 14px);
