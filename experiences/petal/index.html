<body>
<main class="shell">
  <header class="masthead"><div class="brand"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 20V5l6-2 6 2v15M3 20h18M12 3v17M9 10h.01M15 10h.01"/></svg>LV ZION STUDY ROOMS</div><span class="edition">Petal</span></header>
  <section class="invitation" aria-label="Choose a day">
    <div class="days" id="days" aria-label="Available dates"><button class="ticket" type="button" disabled><span class="date-copy"><b>Connecting</b><small>Finding your days</small></span></button></div>
  </section>
  <section class="daycard" aria-labelledby="dayTitle">
    <div class="card-top">
      <div class="resources" id="resources" aria-label="Resource type"></div>
      <div class="day-heading"><h2 id="dayTitle">Schedule</h2><span class="hours">10 AM to 11 PM</span></div>
      <div class="legend" aria-label="Reservation purposes"><span><i></i>Contact</span><span><i class="new"></i>New Member</span><span><i class="other"></i>Other</span></div>
      <p class="sample-caption"><span><span id="scheduleMode">Connecting to your schedule</span><span class="sample-dot"></span><span id="dateCaption"></span></span><span class="tap-hint" id="tapHint">Checking availability</span></p>
    </div>
    <div id="stateNote" class="state-note" role="status"><div><b>Unfolding your day...</b><p>Connecting to the live schedule.</p></div><button type="button" class="text-button" data-retry>Retry</button></div>
    <div id="status" class="inline-status" role="status" aria-live="polite"></div>
    <div class="schedule" id="schedule" aria-label="Daily schedule"></div>
    <div class="actionbar"><button class="primary" id="reserve" type="button" disabled>Reserve Now <span class="arrow" aria-hidden="true">&#8594;</span></button></div>
  </section>
  <nav class="member-links" aria-label="Member navigation"><a href="/?classic=1&amp;tab=mine">My reservations</a><a href="/?classic=1">Current app</a><a href="/?choose=1">Change design</a></nav><p class="footer" id="footerNote">LV Zion Study Rooms</p>
</main>
<dialog id="bookingDialog" aria-labelledby="stepTitle" aria-describedby="stepHint">
  <div class="sheet-inner"><div class="grip" aria-hidden="true"></div><div class="sheet-nav"><button id="back" class="icon-button" aria-label="Previous step" type="button">&#8592;</button><span id="stepCounter" class="step-counter"></span><button id="close" class="icon-button" aria-label="Close reservation" type="button">&times;</button></div><div id="sheetConnection" class="sheet-connection" role="status" hidden></div><div id="sheetBody"></div></div>
</dialog>
