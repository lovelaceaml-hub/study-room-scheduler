<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LV Rooms — Prism Grid</title>
<style>
:root{--bg:#050714;--panel:#0b1022cc;--line:#ffffff1c;--text:#f7f9ff;--muted:#9aa5c3;--contact:#ff4f88;--new:#54d6ff;--other:#ffc65c;--open:#59e6b0;--violet:#8d6bff;--row:46px;--time:58px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}body{min-height:100vh;overflow-x:hidden}button,input{font:inherit}.ambient{position:fixed;inset:0;overflow:hidden;pointer-events:none;background:radial-gradient(circle at 15% 10%,#30206d 0,transparent 34%),radial-gradient(circle at 90% 18%,#0b5f7b 0,transparent 30%),radial-gradient(circle at 55% 88%,#60204d 0,transparent 32%),linear-gradient(180deg,#07101f,#040611 70%)}.beam{position:absolute;width:58vw;height:120vh;top:-20vh;filter:blur(42px);opacity:.22;transform:rotate(22deg);background:linear-gradient(90deg,transparent,#7d61ff66,#54d6ff66,transparent);animation:sweep 10s ease-in-out infinite alternate}.beam.b{right:-25vw;animation-delay:-4s}.beam.a{left:-30vw}@keyframes sweep{to{transform:translateX(28vw) rotate(15deg)}}
.app{position:relative;z-index:1;max-width:760px;margin:auto;padding:18px 14px 132px}.glass{background:linear-gradient(180deg,#ffffff14,#ffffff08);border:1px solid #ffffff20;box-shadow:inset 0 1px 0 #ffffff2e,0 22px 70px #0008;backdrop-filter:blur(24px) saturate(140%)}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.brand{font-size:11px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}.brand i{display:inline-block;width:10px;height:10px;border-radius:3px;background:linear-gradient(145deg,#a98cff,#56ddff);box-shadow:0 0 16px #7c6cff;margin-right:8px;transform:rotate(45deg)}.avatar{width:38px;height:38px;border-radius:14px;display:grid;place-items:center;font-weight:900;background:linear-gradient(145deg,#ffffff22,#ffffff08);border:1px solid #ffffff2b;box-shadow:inset 0 1px 0 #ffffff44,0 8px 24px #0005}.hero{padding:18px;border-radius:28px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:40px;right:-85px;top:-80px;background:linear-gradient(135deg,#8d6bff44,#54d6ff11);transform:rotate(32deg);box-shadow:inset 0 1px 0 #ffffff22}.eyebrow{color:#9f8cff;text-transform:uppercase;letter-spacing:.14em;font-size:10px;font-weight:900}h1{font-size:40px;line-height:.96;letter-spacing:-.05em;margin:8px 0}.hero p{margin:0;color:var(--muted);font-size:14px;max-width:520px}.daybar{display:flex;gap:8px;margin:14px 0}.day{flex:1;padding:12px 13px;border-radius:17px;border:1px solid #ffffff1e;background:#ffffff0b;color:var(--muted);text-align:left}.day b{display:block;color:white;font-size:15px}.day.on{background:linear-gradient(145deg,#8d6bff44,#54d6ff22);box-shadow:inset 0 1px 0 #ffffff3d,0 10px 28px #30206d55;border-color:#9f8cff55}
.controls{padding:12px;border-radius:24px;margin:14px 0}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tab{border:1px solid #ffffff1c;background:#ffffff09;color:var(--muted);padding:11px 8px;border-radius:16px;font-weight:800}.tab.on{color:white;background:linear-gradient(145deg,#7e64ff55,#17bce744);border-color:#ffffff40;box-shadow:inset 0 1px 0 #ffffff44,0 10px 24px #0005}.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:10px;color:var(--muted);font-weight:800}.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:4px;vertical-align:-1px}.titleRow{display:flex;align-items:end;justify-content:space-between;margin:18px 2px 9px}.titleRow h2{margin:0;font-size:19px}.titleRow span{color:var(--muted);font-size:11px}.calendarShell{border-radius:26px;overflow:hidden}.calendarTop{display:grid;grid-template-columns:var(--time) repeat(var(--cols),minmax(92px,1fr));position:sticky;top:0;z-index:12;background:#0b1022f2;backdrop-filter:blur(20px);border-bottom:1px solid #ffffff1d;min-width:max-content}.calendarTop .corner,.head{height:54px;display:grid;place-items:center;font-size:11px;font-weight:900}.head{border-left:1px solid #ffffff14}.head small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.gridWrap{overflow:auto;max-height:68vh;position:relative}.grid{display:grid;grid-template-columns:var(--time) repeat(var(--cols),minmax(92px,1fr));min-width:max-content;position:relative}.timeCol{position:sticky;left:0;z-index:8;background:linear-gradient(90deg,#0b1022 82%,#0b102200)}.timeSlot{height:var(--row);font-size:10px;color:#8e99b8;font-weight:800;padding:5px 8px;text-align:right;border-top:1px solid #ffffff10}.col{position:relative;border-left:1px solid #ffffff14;background-image:repeating-linear-gradient(180deg,transparent 0 calc(var(--row) - 1px),#ffffff0e calc(var(--row) - 1px) var(--row));height:calc(var(--rows) * var(--row))}.block{position:absolute;left:5px;right:5px;border-radius:12px;padding:7px 7px;overflow:hidden;font-size:10px;line-height:1.1;border:1px solid #ffffff2e;box-shadow:inset 0 1px 0 #ffffff42,0 8px 18px #0006}.block b{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.block span{display:block;margin-top:3px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;font-size:8px}.block.open{background:linear-gradient(145deg,#59e6b01e,#1fd5a014);color:#a9f8da;border-color:#59e6b050}.block.contact{background:linear-gradient(145deg,#ff6c9bde,#b5225ce8)}.block.new{background:linear-gradient(145deg,#6cdeffeb,#167fb8ed);color:#031824}.block.other{background:linear-gradient(145deg,#ffd97de8,#e59a28e8);color:#261300}.block.service{background:repeating-linear-gradient(135deg,#ffffff18 0 7px,#ffffff08 7px 14px);color:#b3bdd6;border-style:dashed}.now{position:absolute;left:var(--time);right:0;height:2px;background:#fff;box-shadow:0 0 12px #fff,0 0 28px #8d6bff;z-index:7}.now:before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 12px #fff}.dock{position:fixed;z-index:40;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 24px),720px);padding:8px;border-radius:24px;background:#09101ee8;border:1px solid #ffffff24;backdrop-filter:blur(26px);box-shadow:0 20px 60px #000a}.reserve{width:100%;border:0;border-radius:17px;padding:17px;background:linear-gradient(120deg,#8d6bff,#ff4f88 48%,#ffab4f);color:white;font-size:18px;font-weight:950;letter-spacing:-.02em;box-shadow:inset 0 2px 0 #ffffff55,inset 0 -5px 0 #55163766,0 12px 34px #8d6bff55;position:relative;overflow:hidden}.reserve:after{content:"";position:absolute;inset:-50% auto -50% -30%;width:30%;background:linear-gradient(90deg,transparent,#fff7,transparent);transform:rotate(18deg);animation:shine 3.8s infinite}@keyframes shine{0%,60%{left:-35%}100%{left:135%}}.scrim{position:fixed;inset:0;z-index:50;background:#02050bc9;backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:.25s}.scrim.on{opacity:1;pointer-events:auto}.sheet{position:fixed;z-index:60;left:50%;bottom:0;transform:translate(-50%,110%);width:min(100%,720px);max-height:90vh;overflow:auto;background:linear-gradient(180deg,#121832f5,#090d1cf8);border:1px solid #ffffff26;border-bottom:0;border-radius:30px 30px 0 0;padding:10px 16px calc(26px + env(safe-area-inset-bottom));box-shadow:0 -28px 90px #000b;transition:.42s cubic-bezier(.2,.9,.25,1)}.sheet.on{transform:translate(-50%,0)}.grip{width:44px;height:5px;border-radius:99px;background:#ffffff35;margin:2px auto 8px}.sheetBar{display:flex;align-items:center;justify-content:space-between}.icon{width:40px;height:40px;border:1px solid #ffffff1e;border-radius:14px;background:#ffffff0a;color:white}.dots{display:flex;gap:5px}.dots i{width:7px;height:7px;border-radius:50%;background:#ffffff28}.dots i.on{width:22px;border-radius:99px;background:linear-gradient(90deg,#8d6bff,#54d6ff)}.step h3{font-size:27px;letter-spacing:-.035em;margin:14px 0 5px}.hint{margin:0 0 15px;color:var(--muted);font-size:13px}.choices{display:grid;gap:9px}.choice{border:1px solid #ffffff1d;background:linear-gradient(145deg,#ffffff12,#ffffff07);color:white;border-radius:20px;padding:14px;text-align:left;display:flex;align-items:center;gap:12px;box-shadow:inset 0 1px 0 #ffffff20}.choice .ico{width:48px;height:48px;border-radius:15px;background:linear-gradient(145deg,#8d6bff55,#54d6ff22);display:grid;place-items:center;font-size:22px;box-shadow:inset 0 1px 0 #ffffff35}.choice b{display:block;font-size:16px}.choice small{color:var(--muted)}.rank{margin-left:auto;font-size:9px;font-weight:900;color:#c0c8dd;text-transform:uppercase}.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.chip{border:1px solid #ffffff1c;background:#ffffff09;color:white;border-radius:14px;padding:13px 4px;font-weight:800}.chip.on,.chip:hover{background:linear-gradient(145deg,#8d6bff77,#3bb9df66);border-color:#ffffff44}.field{width:100%;border-radius:15px;border:1px solid #ffffff1d;background:#0306107d;color:white;padding:14px}.go{width:100%;border:0;border-radius:16px;padding:16px;background:linear-gradient(120deg,#8d6bff,#ff4f88);color:white;font-weight:900;margin-top:11px}.summary{padding:16px;border-radius:22px;background:linear-gradient(145deg,#ffffff13,#ffffff08);border:1px solid #ffffff1d}.sum{display:flex;justify-content:space-between;gap:15px;padding:10px 0;border-top:1px solid #ffffff12;font-size:13px}.sum span{color:var(--muted)}.done{text-align:center;padding:10px 0}.orb{width:82px;height:82px;border-radius:28px;display:grid;place-items:center;margin:8px auto 16px;background:linear-gradient(145deg,#59e6b0,#2a8f73);font-size:36px;box-shadow:inset 0 2px 0 #ffffff70,0 18px 45px #59e6b044}@media(max-width:430px){h1{font-size:35px}.hero{padding:16px}.gridWrap{max-height:66vh}.calendarTop{top:0}}
</style>
</head>
<body>
<div class="ambient"><div class="beam a"></div><div class="beam b"></div></div>
<main class="app">
  <div class="top"><div class="brand"><i></i>LV Zion Rooms</div><div class="avatar">LV</div></div>
  <section class="hero glass"><div class="eyebrow">Prism architecture</div><h1>Your whole day,<br>in one living grid.</h1><p>See every room and every time slot. Reserve without losing sight of the day.</p></section>
  <div class="daybar"><button class="day on" data-day="sat"><b>Saturday · Sep 12</b>Full service day</button><button class="day" data-day="tue"><b>Tuesday · Sep 15</b>Midweek</button></div>
  <section class="controls glass"><div class="tabs"><button class="tab on" data-type="room">Rooms</button><button class="tab" data-type="tv">TVs</button><button class="tab" data-type="whiteboard">Whiteboards</button></div><div class="legend"><span><i style="background:var(--contact)"></i>Contact</span><span><i style="background:var(--new)"></i>New Member</span><span><i style="background:var(--other)"></i>Other</span><span><i style="background:var(--open)"></i>Available</span></div></section>
  <div class="titleRow"><h2 id="title">Rooms · full day</h2><span>10 AM–11 PM · 30 min slots</span></div>
  <section class="calendarShell glass"><div class="calendarTop" id="calHead"></div><div class="gridWrap"><div class="grid" id="grid"></div></div></section>
</main>
<div class="dock"><button class="reserve" id="reserve">＋ Reserve Now</button></div>
<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grip"></div><div class="sheetBar"><button class="icon" id="back">←</button><div class="dots" id="dots"></div><button class="icon" id="close">×</button></div><div id="body"></div></section>
<script>
const START=600,END=1380,STEP=30,ROWS=(END-START)/STEP;
const TYPES={room:{label:'Room',plural:'Rooms',units:['Room 1','Room 2','Room 3','Room 4']},tv:{label:'TV',plural:'TVs',units:['TV 1','TV 2','TV 3']},whiteboard:{label:'Whiteboard',plural:'Whiteboards',units:['WB 1','WB 2','WB 3','WB 4','WB 5']}};
const bookings={sat:{room:[['Room 1',660,780,'Elena M.','contact',''],['Room 1',1350,1380,'Samuel D.','other','Review meeting'],['Room 2',690,750,'Isaac V.','other','Catching up'],['Room 2',960,1050,'Jordan A.','new',''],['Room 3',660,750,'Grace L.','new',''],['Room 3',1050,1140,'Anthony','other','Family Bible study'],['Room 4',930,990,'Maria R.','contact',''],['Room 4',1230,1320,'Noah P.','other','Review']],tv:[['TV 1',960,1050,'Micah S.','other','Video lesson'],['TV 2',720,780,'Maria R.','new','']],whiteboard:[['WB 1',660,720,'Daniel K.','other','Planning'],['WB 2',1050,1140,'Hannah C.','contact','']]},tue:{room:[['Room 4',600,810,'Anthony','contact',''],['Room 2',660,690,'Taylor B.','other','Catching up'],['Room 1',1080,1140,'Sofia M.','other','Family Bible study'],['Room 3',1230,1290,'Grace L.','new','']],tv:[['TV 1',840,900,'Maria R.','new','']],whiteboard:[['WB 1',960,1050,'Daniel K.','other','Planning']]}};
const services={sat:[[600,660,'Morning Service'],[870,930,'Afternoon Service'],[1170,1230,'Evening Service']],tue:[[1170,1230,'Evening Service']]};
let type='room',day='sat',step=0,draft={};const $=s=>document.querySelector(s);const fmt=m=>{let h=Math.floor(m/60),mm=m%60;return ((h+11)%12+1)+(mm?':'+String(mm).padStart(2,'0'):'')+' '+(h<12?'AM':'PM')};
function purposeLabel(p){return p==='new'?'New Member':p[0].toUpperCase()+p.slice(1)}
function renderCalendar(){const t=TYPES[type],grid=$('#grid'),head=$('#calHead');document.documentElement.style.setProperty('--cols',t.units.length);document.documentElement.style.setProperty('--rows',ROWS);$('#title').textContent=t.plural+' · full day';head.innerHTML='<div class="corner">Time</div>'+t.units.map((u,i)=>`<div class="head">${u}<small>${i+1}</small></div>`).join('');let times='';for(let i=0;i<ROWS;i++)times+=`<div class="timeSlot">${fmt(START+i*STEP)}</div>`;let cols=t.units.map(u=>{let html='',cursor=START;const all=(bookings[day][type]||[]).filter(b=>b[0]===u).sort((a,b)=>a[1]-b[1]);while(cursor<END){const svc=services[day].find(s=>cursor>=s[0]&&cursor<s[1]);if(svc){if(cursor===svc[0])html+=mkBlock(svc[0],svc[1],'service',svc[2],'Unavailable');cursor=svc[1];continue}const b=all.find(x=>cursor>=x[1]&&cursor<x[2]);if(b){if(cursor===b[1])html+=mkBlock(b[1],b[2],b[4],b[3],purposeLabel(b[4])+(b[5]?' · '+b[5]:''));cursor=b[2];continue}let next=Math.min(END,...all.filter(x=>x[1]>cursor).map(x=>x[1]),...services[day].filter(x=>x[0]>cursor).map(x=>x[0]));html+=mkBlock(cursor,next,'open','Available',fmt(cursor)+'–'+fmt(next));cursor=next}return `<div class="col">${html}</div>`}).join('');grid.innerHTML=`<div class="timeCol">${times}</div>${cols}`;}
function mkBlock(a,b,cls,name,sub){let top=(a-START)/STEP*46+3,height=(b-a)/STEP*46-6;return `<div class="block ${cls}" style="top:${top}px;height:${height}px"><b>${name}</b><span>${sub}</span></div>`}
function openSheet(){draft={type:null,purpose:null,note:'',start:null,end:null,name:''};step=0;$('#scrim').classList.add('on');$('#sheet').classList.add('on');renderStep()}
function closeSheet(){$('#scrim').classList.remove('on');$('#sheet').classList.remove('on')}
function availableStarts(tp){let out=[];for(let m=START;m<END;m+=STEP){if(services[day].some(s=>m>=s[0]&&m<s[1]))continue;if(TYPES[tp].units.some(u=>!(bookings[day][tp]||[]).some(b=>b[0]===u&&m>=b[1]&&m<b[2])))out.push(m)}return out}
function maxEnd(tp,start){let best=start+STEP;for(const u of TYPES[tp].units){let e=END;for(const s of services[day])if(s[0]>start)e=Math.min(e,s[0]);for(const b of (bookings[day][tp]||[]))if(b[0]===u&&b[1]>start)e=Math.min(e,b[1]);const blocked=(bookings[day][tp]||[]).some(b=>b[0]===u&&start>=b[1]&&start<b[2])||services[day].some(s=>start>=s[0]&&start<s[1]);if(!blocked)best=Math.max(best,e)}return best}
function renderStep(){const labels=['Type','Purpose','Start','End','Confirm'];$('#dots').innerHTML=labels.map((_,i)=>`<i class="${i===step?'on':''}"></i>`).join('');$('#back').style.visibility=step===0?'hidden':'visible';let h='';if(step===0)h=`<div class="step"><h3>What would you like to reserve?</h3><p class="hint">Choose a resource. The full-day grid remains behind you.</p><div class="choices">${Object.entries(TYPES).map(([k,v])=>`<button class="choice" data-type="${k}"><span class="ico">${k==='room'?'▦':k==='tv'?'▣':'✎'}</span><span><b>${v.label}</b><small>${v.units.length} available resources</small></span></button>`).join('')}</div></div>`;else if(step===1)h=`<div class="step"><h3>What is the room for?</h3><p class="hint">Priority is explicit so the reservation purpose is clear on the schedule.</p><div class="choices"><button class="choice" data-purpose="contact"><span class="ico">1</span><span><b>Contact</b><small>1st priority</small></span><span class="rank">First</span></button><button class="choice" data-purpose="new"><span class="ico">2</span><span><b>New Member</b><small>2nd priority</small></span><span class="rank">Second</span></button><button class="choice" data-purpose="other"><span class="ico">3</span><span><b>Other</b><small>Last priority · description required</small></span><span class="rank">Last</span></button></div>${draft.purpose==='other'?'<input id="note" class="field" placeholder="What is it for?" style="margin-top:10px"><button class="go" id="otherGo">Continue</button>':''}</div>`;else if(step===2){let starts=availableStarts(draft.type);h=`<div class="step"><h3>When would you like to start?</h3><p class="hint">Only actual times with at least one ${TYPES[draft.type].label.toLowerCase()} available are shown.</p><div class="chips">${starts.map(m=>`<button class="chip" data-start="${m}">${fmt(m)}</button>`).join('')}</div></div>`}else if(step===3){let max=maxEnd(draft.type,draft.start),ends=[];for(let m=draft.start+STEP;m<=max;m+=STEP)ends.push(m);h=`<div class="step"><h3>When would you like to end?</h3><p class="hint">Starting at ${fmt(draft.start)}.</p><div class="chips">${ends.map(m=>`<button class="chip" data-end="${m}">${fmt(m)}</button>`).join('')}</div></div>`}else if(step===4)h=`<div class="step"><h3>Confirm reservation</h3><p class="hint">One final check.</p><div class="summary"><div class="sum"><span>Resource</span><b>${TYPES[draft.type].label}</b></div><div class="sum"><span>Purpose</span><b>${purposeLabel(draft.purpose)}</b></div><div class="sum"><span>Time</span><b>${fmt(draft.start)}–${fmt(draft.end)}</b></div></div><input id="name" class="field" placeholder="Your name" style="margin-top:10px"><button class="go" id="confirm">Confirm reservation</button></div>`;else h=`<div class="done"><div class="orb">✓</div><h3>Reserved</h3><p class="hint">Your reservation has been added to the prototype schedule.</p><button class="go" id="done">Back to full-day schedule</button></div>`;$('#body').innerHTML=h}
$('#reserve').onclick=openSheet;$('#close').onclick=closeSheet;$('#scrim').onclick=closeSheet;$('#back').onclick=()=>{if(step>0){step--;renderStep()}};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{type=b.dataset.type;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));renderCalendar()});document.querySelectorAll('.day').forEach(b=>b.onclick=()=>{day=b.dataset.day;document.querySelectorAll('.day').forEach(x=>x.classList.toggle('on',x===b));renderCalendar()});$('#body').onclick=e=>{let x=e.target.closest('[data-type]');if(x){draft.type=x.dataset.type;if(draft.type==='room'){step=1}else{draft.purpose='other';draft.note=draft.type==='tv'?'TV reservation':'Whiteboard reservation';step=2}return renderStep()}x=e.target.closest('[data-purpose]');if(x){draft.purpose=x.dataset.purpose;if(draft.purpose==='other')return renderStep();step=2;return renderStep()}if(e.target.id==='otherGo'){draft.note=$('#note').value.trim();if(!draft.note)return;step=2;return renderStep()}x=e.target.closest('[data-start]');if(x){draft.start=+x.dataset.start;step=3;return renderStep()}x=e.target.closest('[data-end]');if(x){draft.end=+x.dataset.end;step=4;return renderStep()}if(e.target.id==='confirm'){draft.name=$('#name').value.trim();if(!draft.name)return;const unit=TYPES[draft.type].units.find(u=>!(bookings[day][draft.type]||[]).some(b=>b[0]===u&&draft.start<b[2]&&draft.end>b[1]));if(unit){bookings[day][draft.type].push([unit,draft.start,draft.end,draft.name,draft.purpose,draft.note]);type=draft.type;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.type===type));renderCalendar()}step=5;return renderStep()}if(e.target.id==='done')closeSheet()};
renderCalendar();
</script>
</body></html>
