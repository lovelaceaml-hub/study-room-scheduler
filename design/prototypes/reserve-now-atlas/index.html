<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LV Rooms — Atlas Prototype</title>
<style>
:root{--ink:#171a22;--muted:#6f7480;--paper:#f6f2e9;--card:#fffdf8;--line:#ddd7cb;--navy:#21314c;--violet:#6757d9;--mint:#cfeadf;--mint2:#edf8f3;--rose:#f4c5cf;--rose2:#fff1f4;--amber:#f0d59d;--amber2:#fff8e7;--blue:#c8dbf7;--blue2:#eef5ff;--shadow:0 18px 50px rgba(31,34,41,.12)}
*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text",Segoe UI,sans-serif}body{min-height:100vh}button,input{font:inherit}button{cursor:pointer}.app{max-width:720px;margin:auto;padding:18px 16px 132px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.brand{font-size:12px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}.brand b{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--violet);margin-right:8px}.avatar{width:38px;height:38px;border-radius:50%;background:var(--navy);color:white;display:grid;place-items:center;font-weight:800}.eyebrow{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.12em;color:var(--violet)}h1{font-size:42px;letter-spacing:-.05em;line-height:.95;margin:7px 0 8px}.lead{margin:0;color:var(--muted);font-size:15px;line-height:1.45}.daypick{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:22px 0}.day{border:1px solid var(--line);background:rgba(255,255,255,.45);padding:13px 14px;border-radius:18px;text-align:left;color:var(--muted)}.day strong{display:block;color:var(--ink);font-size:16px}.day.on{background:var(--navy);border-color:var(--navy);color:#cfd8e9;box-shadow:0 10px 28px rgba(33,49,76,.22)}.day.on strong{color:white}.snapshot{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:18px;box-shadow:var(--shadow)}.snaphead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}.snaphead h2{margin:0;font-size:22px;letter-spacing:-.03em}.snaphead span{font-size:12px;color:var(--muted)}.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}.meter{border:0;border-radius:18px;padding:14px;text-align:left;background:#f4f1eb}.meter small{display:block;color:var(--muted);font-weight:800}.meter b{display:block;font-size:28px;line-height:1;margin-top:7px}.meter em{font-style:normal;font-size:11px;color:var(--muted)}.meter.on{background:var(--navy);color:white}.meter.on small,.meter.on em{color:#c8d1df}.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin:24px 2px 10px}.sectionTitle h3{margin:0;font-size:18px}.sectionTitle span{font-size:12px;color:var(--muted)}.schedule{display:grid;gap:10px}.roomCard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px}.roomTop{display:flex;justify-content:space-between;align-items:center;gap:10px}.roomName{font-weight:900}.status{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;padding:6px 9px;border-radius:999px;background:var(--mint2);color:#2d7259}.rail{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin:13px 0 10px}.seg{height:34px;border-radius:8px;background:var(--mint)}.seg.contact{background:var(--rose)}.seg.new{background:var(--blue)}.seg.other{background:var(--amber)}.seg.service{background:repeating-linear-gradient(135deg,#ddd7cb 0 4px,#f4f0e7 4px 8px)}.times{display:flex;justify-content:space-between;color:var(--muted);font-size:10px}.booking{margin-top:10px;padding-top:10px;border-top:1px solid #ebe6dc;display:flex;justify-content:space-between;gap:10px;font-size:12px}.booking b{font-size:13px}.pill{padding:5px 8px;border-radius:999px;font-weight:800}.pill.contact{background:var(--rose2);color:#a44c61}.pill.new{background:var(--blue2);color:#4d6c9b}.pill.other{background:var(--amber2);color:#8b6820}.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px;font-size:11px;color:var(--muted)}.legend i{width:10px;height:10px;display:inline-block;border-radius:3px;margin-right:4px}.dock{position:fixed;z-index:40;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 24px),690px);background:rgba(255,253,248,.92);border:1px solid rgba(213,207,194,.92);backdrop-filter:blur(18px);padding:9px;border-radius:24px;box-shadow:0 18px 60px rgba(22,26,34,.22)}.reserve{width:100%;border:0;border-radius:17px;background:var(--navy);color:#fff;padding:17px 20px;font-size:17px;font-weight:900;display:flex;justify-content:center;align-items:center;gap:9px}.reserve span{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:var(--violet);font-size:20px;line-height:1}.scrim{position:fixed;inset:0;background:rgba(23,26,34,.36);backdrop-filter:blur(4px);z-index:50;opacity:0;pointer-events:none;transition:.25s}.scrim.on{opacity:1;pointer-events:auto}.sheet{position:fixed;z-index:60;left:50%;bottom:0;transform:translate(-50%,110%);width:min(100%,720px);max-height:90vh;overflow:auto;background:#fffdf8;border-radius:30px 30px 0 0;padding:12px 18px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -25px 70px rgba(23,26,34,.24);transition:.38s cubic-bezier(.2,.9,.2,1)}.sheet.on{transform:translate(-50%,0)}.grip{width:46px;height:5px;border-radius:999px;background:#d7d1c5;margin:0 auto 10px}.sheetbar{display:flex;justify-content:space-between;align-items:center}.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff}.progress{display:flex;gap:5px}.progress i{width:7px;height:7px;border-radius:50%;background:#ddd7cb}.progress i.on{width:20px;border-radius:999px;background:var(--violet)}.step h3{font-size:28px;letter-spacing:-.04em;margin:14px 0 5px}.hint{color:var(--muted);margin:0 0 17px}.choices{display:grid;gap:10px}.choice{border:1px solid var(--line);background:#fff;padding:16px;border-radius:20px;text-align:left;display:flex;gap:13px;align-items:center}.choice:hover{border-color:#b8b0a2}.choice .ico{width:48px;height:48px;border-radius:15px;background:#f1eee8;display:grid;place-items:center;font-size:23px}.choice b{display:block;font-size:17px}.choice small{color:var(--muted)}.priority.contact .ico{background:var(--rose2)}.priority.new .ico{background:var(--blue2)}.priority.other .ico{background:var(--amber2)}.rank{margin-left:auto;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.chip{border:1px solid var(--line);background:#fff;padding:13px 4px;border-radius:14px;font-weight:800}.chip:hover,.chip.on{background:var(--navy);border-color:var(--navy);color:white}.field{width:100%;border:1px solid var(--line);border-radius:15px;padding:14px 15px;background:#fff;font-size:16px}.continue{width:100%;border:0;border-radius:16px;padding:16px;background:var(--navy);color:white;font-weight:900;margin-top:12px}.summary{border:1px solid var(--line);background:#f7f3eb;border-radius:22px;padding:17px}.summary h4{margin:0 0 12px;font-size:20px}.sumrow{display:flex;justify-content:space-between;gap:15px;border-top:1px solid #e4ded3;padding:10px 0;font-size:13px}.sumrow span{color:var(--muted)}.done{text-align:center;padding:14px 0}.check{width:82px;height:82px;border-radius:50%;background:var(--mint);display:grid;place-items:center;margin:10px auto 17px;font-size:34px}.hidden{display:none!important}@media(max-width:430px){h1{font-size:38px}.meters{gap:7px}.meter{padding:12px 10px}.meter b{font-size:24px}.roomCard{padding:13px}.rail{gap:3px}.chips{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<main class="app">
  <div class="top"><div class="brand"><b></b>LV Zion Rooms</div><div class="avatar">LV</div></div>
  <div class="eyebrow">Reserve with confidence</div>
  <h1>Find the right space<br>for the right moment.</h1>
  <p class="lead">A calmer view of the day. See what is open, understand priority at a glance, and reserve in a few taps.</p>
  <div class="daypick"><button class="day on" data-day="sat"><strong>Saturday · Sep 12</strong>Primary service day</button><button class="day" data-day="tue"><strong>Tuesday · Sep 15</strong>Midweek availability</button></div>
  <section class="snapshot">
    <div class="snaphead"><h2>Availability snapshot</h2><span id="snapLabel">Saturday</span></div>
    <div class="meters">
      <button class="meter on" data-type="room"><small>Rooms</small><b>3</b><em>of 4 open now</em></button>
      <button class="meter" data-type="whiteboard"><small>Whiteboards</small><b>4</b><em>of 5 open now</em></button>
      <button class="meter" data-type="tv"><small>TVs</small><b>2</b><em>of 3 open now</em></button>
    </div>
    <div class="legend"><span><i style="background:var(--rose)"></i>Contact</span><span><i style="background:var(--blue)"></i>New Member</span><span><i style="background:var(--amber)"></i>Other</span><span><i style="background:var(--mint)"></i>Open</span></div>
  </section>
  <div class="sectionTitle"><h3 id="listTitle">Rooms today</h3><span>10 AM → 2 PM sample</span></div>
  <div class="schedule" id="schedule"></div>
</main>
<div class="dock"><button class="reserve" id="reserve"><span>+</span>Reserve Now</button></div>
<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" aria-modal="true" role="dialog">
  <div class="grip"></div><div class="sheetbar"><button class="iconbtn" id="back">←</button><div class="progress" id="progress"></div><button class="iconbtn" id="close">×</button></div><div id="body"></div>
</section>
<script>
const TYPES={room:{label:'Room',icon:'▦'},whiteboard:{label:'Whiteboard',icon:'✎'},tv:{label:'TV',icon:'▣'}};
const SAMPLE={room:[
 {name:'Study Room 1',segs:['open','open','contact','contact','open','open','other','other'],booking:'Elena M.',purpose:'contact',time:'11:00–12:00'},
 {name:'Study Room 2',segs:['open','new','new','open','open','open','open','open'],booking:'Jordan A.',purpose:'new',time:'10:30–11:30'},
 {name:'Study Room 3',segs:['open','open','open','open','other','other','open','open'],booking:'Anthony',purpose:'other',time:'12:00–1:00'},
 {name:'Study Room 4',segs:['contact','contact','open','open','open','open','open','open'],booking:'Maria R.',purpose:'contact',time:'10:00–11:00'}],
 whiteboard:[
 {name:'Whiteboard 1 · Large',segs:['open','open','other','other','open','open','open','open'],booking:'Daniel K.',purpose:'other',time:'11:00–12:00'},
 {name:'Whiteboard 2 · Large',segs:['open','open','open','new','new','open','open','open'],booking:'Hannah C.',purpose:'new',time:'11:30–12:30'},
 {name:'Whiteboard 3 · Large',segs:['open','open','open','open','open','open','open','open']},
 {name:'Whiteboard 4 · Vertical',segs:['open','open','open','open','contact','contact','open','open'],booking:'Grace L.',purpose:'contact',time:'12:00–1:00'}],
 tv:[
 {name:'TV 1',segs:['open','open','open','other','other','open','open','open'],booking:'Micah S.',purpose:'other',time:'11:30–12:30'},
 {name:'TV 2',segs:['new','new','open','open','open','open','open','open'],booking:'Maria R.',purpose:'new',time:'10:00–11:00'},
 {name:'TV 3',segs:['open','open','open','open','open','open','open','open']}]
};
let type='room',day='sat',step=0,draft={};
const $=s=>document.querySelector(s), body=$('#body');
function renderSchedule(){const arr=SAMPLE[type];$('#listTitle').textContent=(type==='room'?'Rooms':type==='tv'?'TVs':'Whiteboards')+' today';$('#schedule').innerHTML=arr.map(r=>`<article class="roomCard"><div class="roomTop"><div class="roomName">${r.name}</div><div class="status">${r.booking?'Open later':'Open now'}</div></div><div class="rail">${r.segs.map(x=>`<i class="seg ${x==='open'?'':x}"></i>`).join('')}</div><div class="times"><span>10 AM</span><span>12 PM</span><span>2 PM</span></div>${r.booking?`<div class="booking"><span><b>${r.booking}</b><br>${r.time}</span><span class="pill ${r.purpose}">${r.purpose==='new'?'New Member':r.purpose[0].toUpperCase()+r.purpose.slice(1)}</span></div>`:''}</article>`).join('')}
function setType(t){type=t;document.querySelectorAll('.meter').forEach(x=>x.classList.toggle('on',x.dataset.type===t));renderSchedule()}
document.querySelectorAll('.meter').forEach(b=>b.onclick=()=>setType(b.dataset.type));document.querySelectorAll('.day').forEach(b=>b.onclick=()=>{day=b.dataset.day;document.querySelectorAll('.day').forEach(x=>x.classList.toggle('on',x===b));$('#snapLabel').textContent=day==='sat'?'Saturday':'Tuesday'});
function openSheet(){step=0;draft={};$('#sheet').classList.add('on');$('#scrim').classList.add('on');renderStep()}function closeSheet(){$('#sheet').classList.remove('on');$('#scrim').classList.remove('on')}
$('#reserve').onclick=openSheet;$('#close').onclick=closeSheet;$('#scrim').onclick=closeSheet;$('#back').onclick=()=>{if(step>0){step--;renderStep()}else closeSheet()};
function dots(){$('#progress').innerHTML=[0,1,2,3,4].map(i=>`<i class="${i===step?'on':''}"></i>`).join('')}
function renderStep(){dots();let h='';if(step===0)h=`<div class="step"><h3>What would you like to reserve?</h3><p class="hint">Choose the resource first. We’ll only show times that are actually available.</p><div class="choices">${Object.entries(TYPES).map(([k,v])=>`<button class="choice" data-picktype="${k}"><span class="ico">${v.icon}</span><span><b>${v.label}</b><small>${k==='room'?'4 rooms':k==='tv'?'3 displays':'5 boards'} available throughout the day</small></span></button>`).join('')}</div></div>`;
else if(step===1)h=`<div class="step"><h3>What is the ${TYPES[draft.type].label.toLowerCase()} for?</h3><p class="hint">Purpose determines reservation priority.</p><div class="choices"><button class="choice priority contact" data-purpose="contact"><span class="ico">1</span><span><b>Contact</b><small>Highest priority</small></span><span class="rank">1st priority</span></button><button class="choice priority new" data-purpose="new"><span class="ico">2</span><span><b>New Member</b><small>Second priority</small></span><span class="rank">2nd priority</span></button><button class="choice priority other" data-purpose="other"><span class="ico">3</span><span><b>Other</b><small>Tell us what it is for</small></span><span class="rank">Last priority</span></button></div><div id="otherField"></div></div>`;
else if(step===2)h=`<div class="step"><h3>When would you like to start?</h3><p class="hint">These are live available start times for ${day==='sat'?'Saturday':'Tuesday'}.</p><div class="chips">${['10:30 AM','11:00 AM','11:30 AM','12:30 PM','1:00 PM','1:30 PM','2:00 PM','3:00 PM','4:00 PM'].map(t=>`<button class="chip" data-start="${t}">${t}</button>`).join('')}</div></div>`;
else if(step===3)h=`<div class="step"><h3>When would you like to end?</h3><p class="hint">Starting at ${draft.start}. Only valid ending times are shown.</p><div class="chips">${['11:30 AM','12:00 PM','12:30 PM','1:00 PM','1:30 PM','2:00 PM'].map(t=>`<button class="chip" data-end="${t}">${t}</button>`).join('')}</div></div>`;
else h=`<div class="step"><h3>Confirm your reservation</h3><p class="hint">One final check before it goes on the schedule.</p><div class="summary"><h4>${TYPES[draft.type].label}</h4><div class="sumrow"><span>Day</span><b>${day==='sat'?'Saturday, Sep 12':'Tuesday, Sep 15'}</b></div><div class="sumrow"><span>Purpose</span><b>${draft.purpose==='contact'?'Contact':draft.purpose==='new'?'New Member':draft.note||'Other'}</b></div><div class="sumrow"><span>Time</span><b>${draft.start} → ${draft.end}</b></div></div><input class="field" id="name" placeholder="Your name" style="margin-top:12px"><button class="continue" id="confirm">Confirm reservation</button></div>`;body.innerHTML=h;wire()}
function wire(){body.querySelectorAll('[data-picktype]').forEach(b=>b.onclick=()=>{draft.type=b.dataset.picktype;setType(draft.type);step=1;renderStep()});body.querySelectorAll('[data-purpose]').forEach(b=>b.onclick=()=>{draft.purpose=b.dataset.purpose;if(draft.purpose==='other'){const box=$('#otherField');box.innerHTML=`<input class="field" id="note" placeholder="What is it for?" style="margin-top:12px"><button class="continue" id="noteNext">Continue</button>`;$('#noteNext').onclick=()=>{draft.note=$('#note').value.trim()||'Other';step=2;renderStep()}}else{step=2;renderStep()}});body.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>{draft.start=b.dataset.start;step=3;renderStep()});body.querySelectorAll('[data-end]').forEach(b=>b.onclick=()=>{draft.end=b.dataset.end;step=4;renderStep()});const c=$('#confirm');if(c)c.onclick=()=>{const n=$('#name').value.trim();if(!n){$('#name').focus();return}body.innerHTML=`<div class="done"><div class="check">✓</div><h3>You’re reserved.</h3><p class="hint">${n}, your ${TYPES[draft.type].label.toLowerCase()} is held for ${draft.start} to ${draft.end}.</p><button class="continue" id="finish">Return to schedule</button></div>`;$('#finish').onclick=closeSheet}}
renderSchedule();
</script>
</body>
</html>
