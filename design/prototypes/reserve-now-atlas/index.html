<style>

d:#fff;padding:16px;border-radius:20px;text-align:left;display:flex;gap:13px;align-items:center}.choice:hover{border-color:#b8b0a2}.choice .ico{width:48px;height:48px;border-radius:15px;background:#f1eee8;display:grid;place-items:center;font-size:23px}.choice b{display:block;font-size:17px}.choice small{color:var(--muted)}.priority.contact .ico{background:var(--rose2)}.priority.new .ico{background:var(--blue2)}.priority.other .ico{background:var(--amber2)}.rank{margin-left:auto;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.chip{border:1px solid var(--line);background:#fff;padding:13px 4px;border-radius:14px;font-weight:800}.chip:hover,.chip.on{background:var(--navy);border-color:var(--navy);color:white}.field{width:100%;border:1px solid var(--line);border-radius:15px;padding:14px 15px;background:#fff;font-size:16px}.continue{width:100%;border:0;border-radius:16px;padding:16px;background:var(--navy);color:white;font-weight:900;margin-top:12px}.summary{border:1px solid var(--line);background:#f7f3eb;border-radius:22px;padding:17px}.summary h4{margin:0 0 12px;font-size:20px}.sumrow{display:flex;justify-content:space-between;gap:15px;border-top:1px solid #e4ded3;padding:10px 0;font-size:13px}.sumrow span{color:var(--muted)}.done{text-align:center;padding:14px 0}.check{width:82px;height:82px;border-radius:50%;background:var(--mint);display:grid;place-items:center;margin:10px auto 17px;font-size:34px}.hidden{display:none!important}@media(max-width:430px){h1{font-size:38px}.meters{gap:7px}.meter{padding:12px 10px}.meter b{font-size:24px}.timelineBlock{grid-template-columns:72px minmax(0,1fr);gap:9px}.timelineBlock:not(:last-child)::after{left:35px}.slot{padding:12px}.slotPerson{font-size:15px}.chips{grid-template-columns:repeat(3,1fr)}}
 .schedule{display:block}.calendarScroll{overflow-x:auto;padding:2px 2px 10px}.calendarGrid{display:grid;grid-template-columns:76px repeat(var(--units),minmax(126px,1fr));min-width:610px;border:1px solid var(--line);border-radius:22px;overflow:hidden;background:var(--line);gap:1px}.calendarGrid.roomsGrid{min-width:0;grid-template-columns:64px repeat(4,minmax(0,1fr))}.calendarHead{min-height:55px;padding:11px 8px;display:grid;place-items:center;background:#f2eee6;font-size:11px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}.calendarHead b{display:block;font-size:17px;line-height:1;color:var(--navy)}.calendarTime{min-height:82px;padding:12px 8px;background:#f7f3eb;text-align:right;font-size:12px;font-weight:900;color:var(--navy)}.calendarTime span{display:block;margin-top:4px;font-size:10px;font-weight:700;color:var(--muted)}.calendarCell{min-height:82px;border:0;padding:9px;background:var(--card);text-align:left}.calendarCell.open{background:var(--mint2);cursor:pointer}.calendarCell.open:hover,.calendarCell.open:focus-visible{outline:3px solid var(--violet);outline-offset:-3px}.calendarCell .cellState{display:block;margin-top:18px;font-size:13px;font-weight:900;color:#2d7259}.calendarCell.booked{border-left:4px solid var(--line)}.calendarCell.booked.contact{border-left-color:var(--rose)}.calendarCell.booked.new{border-left-color:var(--blue)}.calendarCell.booked.other{border-left-color:var(--amber)}.calendarCell .cellName{display:block;font-size:14px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.calendarCell .cellPurpose{display:inline-block;margin-top:7px;padding:4px 6px;border-radius:999px;font-size:10px;font-weight:900}.calendarCell.contact .cellPurpose{background:var(--rose2);color:#a44c61}.calendarCell.new .cellPurpose{background:var(--blue2);color:#4d6c9b}.calendarCell.other .cellPurpose{background:var(--amber2);color:#8b6820}@media(max-width:430px){.calendarScroll{margin-right:-2px}.calendarGrid{grid-template-columns:66px repeat(var(--units),minmax(118px,1fr));min-width:540px}.calendarGrid.roomsGrid{min-width:0;grid-template-columns:62px repeat(4,minmax(0,1fr))}.calendarGrid.roomsGrid .calendarHead{padding:9px 3px;font-size:9px}.calendarGrid.roomsGrid .calendarHead b{font-size:16px}.calendarGrid.roomsGrid .calendarCell{padding:7px 5px}.calendarGrid.roomsGrid .cellState{font-size:12px}.calendarGrid.roomsGrid .cellName{font-size:12px}.calendarGrid.roomsGrid .cellPurpose{padding:3px 4px;font-size:8px}.calendarTime{font-size:11px}.calendarCell .cellName{font-size:13px}}
.scheduleCanvas{display:grid;gap:3px}.scheduleHead,.timeBlock{display:grid;grid-template-columns:66px repeat(var(--units),minmax(0,1fr));gap:7px}.scheduleHead{align-items:end;padding:0 2px 7px}.laneHead{min-height:42px;display:grid;place-items:center;color:var(--muted);font-size:9px;font-weight:900;letter-spacing:.09em;text-transform:uppercase}.laneHead b{display:block;color:var(--navy);font-size:17px;line-height:1}.timeBlock{position:relative;align-items:stretch;padding:5px 5px 5px 0;border-radius:0 20px 20px 0}.timeBlock.hourGroup{background:rgba(237,248,243,.35)}.timeRail{position:relative;min-height:84px;border-right:1px solid #d6cec1;margin-right:2px}.timeRail::before{content:"";position:absolute;right:-4px;top:0;width:7px;height:7px;border-radius:50%;background:#d6cec1}.hourMark,.hourEnd{position:absolute;right:8px;z-index:1;padding:2px 5px;border-radius:7px;background:var(--paper);color:var(--navy);font-size:10px;font-weight:900;line-height:1;white-space:nowrap}.hourMark{top:-8px}.hourEnd{bottom:-8px}.roomSlot{min-height:84px;border:1px solid var(--line);border-radius:16px;padding:9px 8px;text-align:left;background:var(--card);box-shadow:0 5px 16px rgba(31,34,41,.05);display:flex;flex-direction:column;justify-content:center;gap:4px}.roomSlot.open{background:var(--mint2);border-style:dashed;color:#2d7259;cursor:pointer}.roomSlot.open:hover,.roomSlot.open:focus-visible{outline:3px solid var(--violet);outline-offset:2px}.roomSlot.booked.contact{background:var(--rose2);border-color:#e8b7c1}.roomSlot.booked.new{background:var(--blue2);border-color:#bfd2f0}.roomSlot.booked.other{background:var(--amber2);border-color:#ead6a6}.slotRoom{font-size:8px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.slotName{font-size:13px;font-weight:900;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.slotOpen{font-size:13px;font-weight:900}.slotPurpose{width:max-content;max-width:100%;padding:3px 5px;border-radius:999px;font-size:8px;font-weight:900;white-space:nowrap}.contact .slotPurpose{background:#f8dde3;color:#a44c61}.new .slotPurpose{background:#dfeafa;color:#4d6c9b}.other .slotPurpose{background:#faedcd;color:#8b6820}@media(max-width:430px){.scheduleHead,.timeBlock{grid-template-columns:56px repeat(4,minmax(0,1fr));gap:5px}.scheduleHead{padding-bottom:5px}.laneHead{font-size:8px}.laneHead b{font-size:15px}.timeBlock{padding:4px 4px 4px 0;border-radius:0 16px 16px 0}.timeRail{min-height:76px}.hourMark,.hourEnd{right:5px;font-size:9px}.roomSlot{min-height:76px;padding:7px 5px;border-radius:13px}.slotRoom{font-size:7px}.slotName,.slotOpen{font-size:11px}.slotPurpose{padding:3px;font-size:7px}}

<body>
<main class="app">
  <div class="top"><div class="brand"><b></b>LV Zion Rooms</div><div class="avatar">LV</div></div>
  <div class="eyebrow">Reserve with confidence</div>
  <h1>Find the right space<br>for the right moment.</h1>
  <p class="lead">A calmer view of the day. See what is open, understand priority at a glance, and reserve in a few taps.</p>
  <div class="daypick"><button class="day on" data-day="sat"><strong>Saturday · Sep 12</strong>Primary service day</button><button class="day" data-day="tue"><strong>Tuesday · Sep 15</strong>Midweek availability</button></div>
  <section class="snapshot">
    <div class="snaphead"><h2>Availability snapshot</h2><span id="snapLabel">Saturday</span></div>
    <div class="meters">
      <button class="meter on" data-type="room"><small>Rooms</small><b>3</b><em>of 4 open now</em></button>
      <button class="meter" data-type="whiteboard"><small>Whiteboards</small><b>4</b><em>of 5 open now</em></button>
      <button class="meter" data-type="tv"><small>TVs</small><b>2</b><em>of 3 open now</em></button>
    </div>
    <div class="legend"><span><i style="background:var(--rose)"></i>Contact</span><span><i style="background:var(--blue)"></i>New Member</span><span><i style="background:var(--amber)"></i>Other</span><span><i style="background:var(--mint)"></i>Open</span></div>
  </section>
  <div class="sectionTitle"><h3 id="listTitle">Rooms today</h3><span>10 AM → 2 PM sample</span></div>
  <div class="schedule" id="schedule"></div>
</main>
<div class="dock"><button class="reserve" id="reserve"><span>+</span>Reserve Now</button></div>
<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" aria-modal="true" role="dialog">
  <div class="grip"></div><div class="sheetbar"><button class="iconbtn" id="back">←</button><div class="progress" id="progress"></div><button class="iconbtn" id="close">×</button></div><div id="body"></div>
</section>
<script>
const TYPES={room:{label:'Room',icon:'▦'},whiteboard:{label:'Whiteboard',icon:'✎'},tv:{label:'TV',icon:'▣'}};
const TIMES=[['10:00 AM','10:30 AM'],['10:30 AM','11:00 AM'],['11:00 AM','11:30 AM'],['11:30 AM','12:00 PM'],['12:00 PM','12:30 PM'],['12:30 PM','1:00 PM'],['1:00 PM','1:30 PM'],['1:30 PM','2:00 PM']];
const UNITS={room:['Study Room 1','Study Room 2','Study Room 3','Study Room 4'],whiteboard:['Whiteboard 1','Whiteboard 2','Whiteboard 3','Whiteboard 4','Whiteboard 5'],tv:['TV 1','TV 2','TV 3']};
const BOOKINGS={room:{'10:00 AM':{'Study Room 4':['Maria R.','contact']},'10:30 AM':{'Study Room 2':['Jordan A.','new'],'Study Room 4':['Maria R.','contact']},'11:00 AM':{'Study Room 1':['Elena M.','contact'],'Study Room 2':['Jordan A.','new']},'11:30 AM':{'Study Room 1':['Elena M.','contact']},'12:00 PM':{'Study Room 3':['Noah P.','other']},'12:30 PM':{'Study Room 3':['Noah P.','other']}},whiteboard:{'11:00 AM':{'Whiteboard 1':['Daniel K.','other']},'11:30 AM':{'Whiteboard 1':['Daniel K.','other'],'Whiteboard 2':['Hannah C.','new']},'12:00 PM':{'Whiteboard 2':['Hannah C.','new'],'Whiteboard 4':['Grace L.','contact']},'12:30 PM':{'Whiteboard 4':['Grace L.','contact']}},tv:{'10:00 AM':{'TV 2':['Maria R.','new']},'10:30 AM':{'TV 2':['Maria R.','new']},'11:30 AM':{'TV 1':['Micah S.','other']},'12:00 PM':{'TV 1':['Micah S.','other']}}};
let type='room',day='sat',step=0,draft={};
const $=s=>document.querySelector(s), body=$('#body');
function purposeLabel(purpose){return purpose==='new'?'New Member':purpose[0].toUpperCase()+purpose.slice(1)}
function hourLabel(time){return time.replace(':00 ',' ')}
function renderSchedule(){const units=UNITS[type],label=type==='room'?'Rooms':type==='tv'?'TVs':'Whiteboards';$('#listTitle').textContent=label+' today';const heads=units.map((unit,index)=>`<div class="laneHead"><b>${index+1}</b>${type==='room'?'Room':TYPES[type].label}</div>`).join('');const rows=TIMES.map(([time,end],rowIndex)=>`<section class="timeBlock ${rowIndex%4<2?'hourGroup':''}"><div class="timeRail" aria-label="${time} to ${end}">${rowIndex%2===0?`<span class="hourMark">${hourLabel(time)}</span>`:''}${rowIndex===TIMES.length-1?`<span class="hourEnd">${hourLabel(end)}</span>`:''}</div>${units.map((unit,index)=>{const booking=BOOKINGS[type][time]?.[unit];return booking?`<article class="roomSlot booked ${booking[1]}"><span class="slotRoom">${type==='room'?'Room':TYPES[type].label} ${index+1}</span><span class="slotName">${booking[0]}</span><span class="slotPurpose">${purposeLabel(booking[1])}</span></article>`:`<button class="roomSlot open" type="button" data-unit="${unit}" data-start="${time}" aria-label="${unit} is available from ${time} to ${end}, reserve it now"><span class="slotRoom">${type==='room'?'Room':TYPES[type].label} ${index+1}</span><span class="slotOpen">Open</span></button>`}).join('')}</section>`).join('');$('#schedule').innerHTML=`<div class="scheduleCanvas" style="--units:${units.length}"><div class="scheduleHead"><div class="laneHead">Time</div>${heads}</div>${rows}</div>`;document.querySelectorAll('.roomSlot.open').forEach(slot=>slot.onclick=()=>openSheet({type,unit:slot.dataset.unit,start:slot.dataset.start}))}
function setType(t){type=t;document.querySelectorAll('.meter').forEach(x=>x.classList.toggle('on',x.dataset.type===t));renderSchedule()}
document.querySelectorAll('.meter').forEach(b=>b.onclick=()=>setType(b.dataset.type));document.querySelectorAll('.day').forEach(b=>b.onclick=()=>{day=b.dataset.day;document.querySelectorAll('.day').forEach(x=>x.classList.toggle('on',x===b));$('#snapLabel').textContent=day==='sat'?'Saturday':'Tuesday'});
function openSheet(selection){if(selection)setType(selection.type);step=selection?1:0;draft=selection?{type:selection.type,unit:selection.unit,start:selection.start}:{};$('#sheet').classList.add('on');$('#scrim').classList.add('on');renderStep()}function closeSheet(){$('#sheet').classList.remove('on');$('#scrim').classList.remove('on')}
$('#reserve').onclick=openSheet;$('#close').onclick=closeSheet;$('#scrim').onclick=closeSheet;$('#back').onclick=()=>{if(step>0){step--;renderStep()}else closeSheet()};
function dots(){$('#progress').innerHTML=[0,1,2,3,4].map(i=>`<i class="${i===step?'on':''}"></i>`).join('')}
function renderStep(){dots();let h='';if(step===0)h=`<div class="step"><h3>What would you like to reserve?</h3><p class="hint">Choose the resource first. We’ll only show times that are actually available.</p><div class="choices">${Object.entries(TYPES).map(([k,v])=>`<button class="choice" data-picktype="${k}"><span class="ico">${v.icon}</span><span><b>${v.label}</b><small>${k==='room'?'4 rooms':k==='tv'?'3 displays':'5 boards'} available throughout the day</small></span></button>`).join('')}</div></div>`;
else if(step===1)h=`<div class="step"><h3>What is ${draft.unit||'this '+TYPES[draft.type].label.toLowerCase()} for?</h3><p class="hint">Purpose determines reservation priority.${draft.start?' Your start time is '+draft.start+'.':''}</p><div class="choices"><button class="choice priority contact" data-purpose="contact"><span class="ico">1</span><span><b>Contact</b><small>Highest priority</small></span><span class="rank">1st priority</span></button><button class="choice priority new" data-purpose="new"><span class="ico">2</span><span><b>New Member</b><small>Second priority</small></span><span class="rank">2nd priority</span></button><button class="choice priority other" data-purpose="other"><span class="ico">3</span><span><b>Other</b><small>Tell us what it is for</small></span><span class="rank">Last priority</span></button></div><div id="otherField"></div></div>`;
else if(step===2)h=`<div class="step"><h3>When would you like to start?</h3><p class="hint">These are live available start times for ${day==='sat'?'Saturday':'Tuesday'}.</p><div class="chips">${['10:30 AM','11:00 AM','11:30 AM','12:30 PM','1:00 PM','1:30 PM','2:00 PM','3:00 PM','4:00 PM'].map(t=>`<button class="chip" data-start="${t}">${t}</button>`).join('')}</div></div>`;
else if(step===3)h=`<div class="step"><h3>When would you like to end?</h3><p class="hint">Starting at ${draft.start}. Only valid ending times are shown.</p><div class="chips">${TIMES.slice(Math.max(0,TIMES.findIndex(([time])=>time===draft.start))).map(([,end])=>`<button class="chip" data-end="${end}">${end}</button>`).join('')}</div></div>`;
else h=`<div class="step"><h3>Confirm your reservation</h3><p class="hint">One final check before it goes on the schedule.</p><div class="summary"><h4>${TYPES[draft.type].label}</h4><div class="sumrow"><span>Day</span><b>${day==='sat'?'Saturday, Sep 12':'Tuesday, Sep 15'}</b></div><div class="sumrow"><span>Purpose</span><b>${draft.purpose==='contact'?'Contact':draft.purpose==='new'?'New Member':draft.note||'Other'}</b></div><div class="sumrow"><span>Time</span><b>${draft.start} → ${draft.end}</b></div></div><input class="field" id="name" placeholder="Your name" style="margin-top:12px"><button class="continue" id="confirm">Confirm reservation</button></div>`;body.innerHTML=h;wire()}
function wire(){const nextAfterPurpose=()=>{step=draft.start?3:2;renderStep()};body.querySelectorAll('[data-picktype]').forEach(b=>b.onclick=()=>{draft.type=b.dataset.picktype;setType(draft.type);step=1;renderStep()});body.querySelectorAll('[data-purpose]').forEach(b=>b.onclick=()=>{draft.purpose=b.dataset.purpose;if(draft.purpose==='other'){const box=$('#otherField');box.innerHTML=`<input class="field" id="note" placeholder="What is it for?" style="margin-top:12px"><button class="continue" id="noteNext">Continue</button>`;$('#noteNext').onclick=()=>{draft.note=$('#note').value.trim()||'Other';nextAfterPurpose()}}else nextAfterPurpose()});body.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>{draft.start=b.dataset.start;step=3;renderStep()});body.querySelectorAll('[data-end]').forEach(b=>b.onclick=()=>{draft.end=b.dataset.end;step=4;renderStep()});const c=$('#confirm');if(c)c.onclick=()=>{const n=$('#name').value.trim();if(!n){$('#name').focus();return}body.innerHTML=`<div class="done"><div class="check">✓</div><h3>You’re reserved.</h3><p class="hint">${n}, your ${draft.unit||TYPES[draft.type].label.toLowerCase()} is held for ${draft.start} to ${draft.end}.</p><button class="continue" id="finish">Return to schedule</button></div>`;$('#finish').onclick=closeSheet}}
renderSchedule();
</script>
</body>
