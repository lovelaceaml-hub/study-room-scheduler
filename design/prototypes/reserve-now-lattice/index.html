<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LV Rooms | Lattice Prototype</title>
<style>
:root{--ink:#18243b;--muted:#64718a;--canvas:#f1f3f8;--paper:#fff;--line:#dce2ec;--navy:#1b2c4a;--blue:#477cf0;--sky:#eaf1ff;--mint:#dff5ed;--mintInk:#177458;--rose:#fff0f2;--roseInk:#b3455b;--lav:#f1edff;--lavInk:#6b55bb;--sand:#fff6df;--sandInk:#926c18;--shadow:0 16px 38px rgba(27,44,74,.12)}
*{box-sizing:border-box}html{background:var(--canvas)}body{margin:0;min-height:100vh;background:radial-gradient(circle at 92% 4%,#dce7ff 0,transparent 28%),var(--canvas);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}button,input{font:inherit}button{cursor:pointer}.app{width:min(100%,760px);margin:auto;padding:16px 16px 130px}.brandbar{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 18px}.brand{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.brandmark{width:23px;height:23px;border-radius:7px;background:linear-gradient(135deg,#6293ff,#4357b9);position:relative}.brandmark:before,.brandmark:after{content:"";position:absolute;background:#fff;border-radius:2px}.brandmark:before{width:11px;height:3px;left:6px;top:10px}.brandmark:after{width:3px;height:11px;left:10px;top:6px}.profile{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:#fff;font-size:12px;font-weight:900}.hero{position:relative;overflow:hidden;border-radius:30px;padding:26px 24px 24px;background:var(--navy);color:#fff;box-shadow:var(--shadow)}.hero:after{content:"";position:absolute;right:-40px;bottom:-62px;width:210px;height:210px;border:28px solid rgba(135,171,255,.23);border-radius:50%}.eyebrow{position:relative;z-index:1;font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#b9c9ef}.hero h1{position:relative;z-index:1;max-width:460px;margin:8px 0 8px;font-size:clamp(34px,8vw,52px);letter-spacing:-.055em;line-height:.94}.hero p{position:relative;z-index:1;max-width:440px;margin:0;color:#c5cfe2;font-size:14px;line-height:1.48}.dates{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0}.date{border:1px solid var(--line);border-radius:17px;padding:12px 13px;background:rgba(255,255,255,.55);text-align:left;color:var(--muted);font-size:11px}.date b{display:block;margin-bottom:3px;color:var(--ink);font-size:14px}.date.active{border-color:var(--blue);background:var(--paper);box-shadow:0 8px 20px rgba(59,95,160,.12)}.overview{display:grid;grid-template-columns:1.15fr repeat(3,.85fr);gap:8px;margin:18px 0 24px}.overview button{min-height:86px;border:0;border-radius:19px;padding:13px;text-align:left;background:var(--paper);box-shadow:0 7px 20px rgba(37,54,83,.06);color:var(--muted)}.overview button:first-child{background:linear-gradient(135deg,#477cf0,#5c66cf);color:#fff}.overview small{display:block;font-size:10px;font-weight:800;letter-spacing:.04em}.overview b{display:block;margin:7px 0 2px;font-size:25px;line-height:1}.overview em{font-style:normal;font-size:10px}.overview .active small,.overview .active em{color:#dbe6ff}.scheduleTitle{display:flex;justify-content:space-between;align-items:end;margin:0 2px 12px}.scheduleTitle h2{margin:0;font-size:21px;letter-spacing:-.04em}.scheduleTitle p{margin:3px 0 0;font-size:11px;color:var(--muted)}.scheduleTitle span{padding:7px 9px;border-radius:99px;background:#e5ebf7;color:#52627e;font-size:10px;font-weight:900;white-space:nowrap}.schedule{overflow:hidden;border:1px solid var(--line);border-radius:26px;background:rgba(255,255,255,.72);box-shadow:0 10px 28px rgba(27,44,74,.06)}.laneHead,.timeRow{display:grid;grid-template-columns:66px repeat(var(--lanes),minmax(0,1fr));gap:6px}.laneHead{padding:13px 10px 9px;align-items:end}.laneHead div{text-align:center;color:var(--muted);font-size:8px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.laneHead b{display:block;color:var(--navy);font-size:16px;line-height:1.1}.timeRow{position:relative;padding:4px 10px 4px 0}.timeRow.group{background:linear-gradient(90deg,rgba(71,124,240,.045),rgba(71,124,240,.015))}.rail{position:relative;min-height:86px;border-right:1px solid #cbd5e5}.rail:after{content:"";position:absolute;right:-4px;top:0;width:7px;height:7px;border-radius:50%;background:#cbd5e5}.hour{position:absolute;right:8px;top:-8px;padding:2px 5px;border-radius:6px;background:var(--paper);font-size:10px;font-weight:900;white-space:nowrap}.endHour{position:absolute;right:8px;bottom:-8px;padding:2px 5px;border-radius:6px;background:var(--paper);font-size:10px;font-weight:900;white-space:nowrap}.slot{position:relative;min-height:86px;border:1px solid var(--line);border-radius:15px;padding:9px 7px;text-align:left;background:var(--paper);box-shadow:0 4px 10px rgba(27,44,74,.035);display:flex;flex-direction:column;justify-content:center;gap:4px;overflow:hidden}.slot:before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:#d5ddea}.slot.open{background:linear-gradient(145deg,#fff,#effaf6);border-style:dashed;color:var(--mintInk)}.slot.open:before{background:#60cda4}.slot.open:hover,.slot.open:focus-visible{outline:3px solid var(--blue);outline-offset:2px}.slot.contact{background:var(--rose)}.slot.contact:before{background:#ef9aae}.slot.new{background:var(--lav)}.slot.new:before{background:#a896ec}.slot.other{background:var(--sand)}.slot.other:before{background:#e8bf5f}.slotLabel{font-size:7px;font-weight:900;letter-spacing:.1em;color:var(--muted)}.slotName{font-size:13px;font-weight:900;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.slotOpen{font-size:13px;font-weight:900}.badge{width:max-content;max-width:100%;padding:3px 5px;border-radius:99px;font-size:7px;font-weight:900;white-space:nowrap}.contact .badge{background:#ffdce2;color:var(--roseInk)}.new .badge{background:#dfd8ff;color:var(--lavInk)}.other .badge{background:#ffe9ad;color:var(--sandInk)}.legend{display:flex;gap:11px;flex-wrap:wrap;padding:13px 14px;color:var(--muted);font-size:10px;font-weight:700}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;background:#60cda4}.legend .c{background:#ef9aae}.legend .n{background:#a896ec}.legend .o{background:#e8bf5f}.dock{position:fixed;z-index:8;left:50%;bottom:calc(13px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 24px),730px);padding:8px;border:1px solid rgba(27,44,74,.13);border-radius:23px;background:rgba(255,255,255,.88);box-shadow:0 18px 50px rgba(27,44,74,.2);backdrop-filter:blur(18px)}.reserve{width:100%;border:0;border-radius:16px;padding:16px;background:var(--navy);color:#fff;font-size:16px;font-weight:900}.reserve span{display:inline-grid;place-items:center;width:21px;height:21px;margin-right:7px;border-radius:50%;background:#5d83ea;font-size:17px;vertical-align:-2px}.scrim{position:fixed;z-index:12;inset:0;background:rgba(14,26,48,.45);opacity:0;pointer-events:none;transition:.2s}.scrim.open{opacity:1;pointer-events:auto}.sheet{position:fixed;z-index:13;left:50%;bottom:0;transform:translate(-50%,110%);width:min(100%,760px);max-height:88vh;overflow:auto;padding:12px 18px calc(22px + env(safe-area-inset-bottom));border-radius:29px 29px 0 0;background:#fff;box-shadow:0 -25px 70px rgba(21,35,59,.22);transition:.3s cubic-bezier(.2,.8,.2,1)}.sheet.open{transform:translate(-50%,0)}.grip{width:42px;height:5px;margin:0 auto 10px;border-radius:99px;background:#d5dce8}.sheetTop{display:flex;justify-content:space-between;align-items:center}.close{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;background:#fff;color:var(--navy);font-size:22px}.steps{display:flex;gap:5px}.steps i{width:7px;height:7px;border-radius:50%;background:#dbe1ea}.steps i.on{width:20px;border-radius:99px;background:var(--blue)}.panel h3{margin:15px 0 6px;font-size:29px;letter-spacing:-.05em}.panel p{margin:0 0 16px;color:var(--muted);line-height:1.45}.choices{display:grid;gap:9px}.choice{width:100%;border:1px solid var(--line);border-radius:17px;padding:14px;text-align:left;background:#fff;color:var(--ink);display:flex;align-items:center;gap:12px}.choice strong{display:block;font-size:16px}.choice small{color:var(--muted)}.tile{width:40px;height:40px;border-radius:13px;background:var(--sky);display:grid;place-items:center;color:var(--blue);font-weight:900}.purpose.contact .tile{background:var(--rose);color:var(--roseInk)}.purpose.new .tile{background:var(--lav);color:var(--lavInk)}.purpose.other .tile{background:var(--sand);color:var(--sandInk)}.timeChoices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.timeChoices button{border:1px solid var(--line);border-radius:13px;padding:12px 5px;background:#fff;color:var(--navy);font-weight:800}.summary{padding:16px;border-radius:19px;background:#f3f6fc}.summary div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid #dfe5ee;font-size:13px}.summary div:first-child{border-top:0}.summary span{color:var(--muted)}.field{width:100%;margin-top:12px;padding:13px;border:1px solid var(--line);border-radius:14px;font-size:16px}.continue{width:100%;margin-top:12px;padding:15px;border:0;border-radius:15px;background:var(--navy);color:#fff;font-weight:900}.done{text-align:center;padding:14px}.check{display:grid;place-items:center;width:66px;height:66px;margin:5px auto 12px;border-radius:50%;background:var(--mint);color:var(--mintInk);font-size:28px;font-weight:900}.hidden{display:none!important}@media(max-width:440px){.app{padding-left:12px;padding-right:12px}.hero{padding:23px 19px}.overview{gap:6px}.overview button{min-height:76px;padding:10px}.overview b{font-size:21px}.overview small,.overview em{font-size:8px}.laneHead,.timeRow{grid-template-columns:56px repeat(var(--lanes),minmax(0,1fr));gap:4px}.laneHead{padding-left:6px;padding-right:6px}.timeRow{padding-right:6px}.slot{min-height:76px;padding:7px 5px;border-radius:12px}.rail{min-height:76px}.slotName,.slotOpen{font-size:11px}.slotLabel,.badge{font-size:6px}.hour,.endHour{right:4px;font-size:9px}.timeChoices{grid-template-columns:repeat(2,1fr)}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<main class="app">
  <div class="brandbar"><div class="brand"><span class="brandmark"></span>LV Zion Rooms</div><div class="profile">LV</div></div>
  <section class="hero"><div class="eyebrow">Saturday schedule</div><h1>Room availability, mapped.</h1><p>See the whole floor at once, then reserve the open space that fits your moment.</p></section>
  <div class="dates"><button class="date active"><b>Saturday, Sep 12</b>Primary service day</button><button class="date"><b>Tuesday, Sep 15</b>Midweek availability</button></div>
  <section class="overview"><button class="active" data-type="room"><small>Rooms</small><b>3</b><em>open now</em></button><button data-type="whiteboard"><small>Boards</small><b>4</b><em>open now</em></button><button data-type="tv"><small>TVs</small><b>2</b><em>open now</em></button><button class="active"><small>Day</small><b>10-2</b><em>sample</em></button></section>
  <div class="scheduleTitle"><div><h2 id="scheduleName">Rooms</h2><p>Tap any open card to reserve it.</p></div><span>4 spaces</span></div>
  <section class="schedule" id="schedule"></section>
</main>
<div class="dock"><button class="reserve" id="reserve"><span>+</span>Reserve a space</button></div>
<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Reservation flow"><div class="grip"></div><div class="sheetTop"><button class="close" id="close" aria-label="Close reservation">×</button><div class="steps" id="steps"></div><span style="width:38px"></span></div><div id="panel"></div></section>
<script>
const TIMES=[['10:00 AM','10:30 AM'],['10:30 AM','11:00 AM'],['11:00 AM','11:30 AM'],['11:30 AM','12:00 PM'],['12:00 PM','12:30 PM'],['12:30 PM','1:00 PM'],['1:00 PM','1:30 PM'],['1:30 PM','2:00 PM']];
const TYPES={room:{label:'Room',plural:'Rooms',units:['Study Room 1','Study Room 2','Study Room 3','Study Room 4']},whiteboard:{label:'Whiteboard',plural:'Whiteboards',units:['Whiteboard 1','Whiteboard 2','Whiteboard 3','Whiteboard 4','Whiteboard 5']},tv:{label:'TV',plural:'TVs',units:['TV 1','TV 2','TV 3']}};
const BOOKINGS={room:{'10:00 AM':{'Study Room 4':['Maria R.','contact']},'10:30 AM':{'Study Room 2':['Jordan A.','new'],'Study Room 4':['Maria R.','contact']},'11:00 AM':{'Study Room 1':['Elena M.','contact'],'Study Room 2':['Jordan A.','new']},'11:30 AM':{'Study Room 1':['Elena M.','contact']},'12:00 PM':{'Study Room 3':['Noah P.','other']},'12:30 PM':{'Study Room 3':['Noah P.','other']}},whiteboard:{'11:00 AM':{'Whiteboard 1':['Daniel K.','other']},'11:30 AM':{'Whiteboard 1':['Daniel K.','other'],'Whiteboard 2':['Hannah C.','new']},'12:00 PM':{'Whiteboard 2':['Hannah C.','new'],'Whiteboard 4':['Grace L.','contact']},'12:30 PM':{'Whiteboard 4':['Grace L.','contact']}},tv:{'10:00 AM':{'TV 2':['Maria R.','new']},'10:30 AM':{'TV 2':['Maria R.','new']},'11:30 AM':{'TV 1':['Micah S.','other']},'12:00 PM':{'TV 1':['Micah S.','other']}}};
let type='room',step=0,draft={};const $=s=>document.querySelector(s),panel=$('#panel');
const hour=t=>t.replace(':00 ',' ');const label=p=>p==='new'?'New Member':p[0].toUpperCase()+p.slice(1);
function renderSchedule(){const config=TYPES[type],units=config.units;$('#scheduleName').textContent=config.plural;const head=units.map((unit,i)=>`<div><b>${i+1}</b>${type==='room'?'Room':config.label}</div>`).join('');const rows=TIMES.map(([start,end],i)=>`<div class="timeRow ${i%4<2?'group':''}"><div class="rail" aria-label="${start} to ${end}">${i%2===0?`<span class="hour">${hour(start)}</span>`:''}${i===TIMES.length-1?`<span class="endHour">${hour(end)}</span>`:''}</div>${units.map((unit,index)=>{const booking=BOOKINGS[type][start]?.[unit];return booking?`<article class="slot ${booking[1]}"><span class="slotLabel">${type==='room'?'Room':config.label} ${index+1}</span><span class="slotName">${booking[0]}</span><span class="badge">${label(booking[1])}</span></article>`:`<button class="slot open" data-unit="${unit}" data-start="${start}" aria-label="${unit} is open from ${start} to ${end}"><span class="slotLabel">${type==='room'?'Room':config.label} ${index+1}</span><span class="slotOpen">Open</span></button>`}).join('')}</div>`).join('');$('#schedule').innerHTML=`<div class="laneHead" style="--lanes:${units.length}"><div>Time</div>${head}</div><div style="--lanes:${units.length}">${rows}</div><div class="legend"><span><i></i>Open</span><span><i class="c"></i>Contact</span><span><i class="n"></i>New Member</span><span><i class="o"></i>Other</span></div>`;document.querySelectorAll('.slot.open').forEach(slot=>slot.onclick=()=>openSheet({type,unit:slot.dataset.unit,start:slot.dataset.start}))}
function setType(next){type=next;document.querySelectorAll('[data-type]').forEach(button=>button.classList.toggle('active',button.dataset.type===next));renderSchedule()}
function openSheet(selection){if(selection)setType(selection.type);step=selection?1:0;draft=selection?{type:selection.type,unit:selection.unit,start:selection.start}:{};$('#sheet').classList.add('open');$('#scrim').classList.add('open');renderStep()}
function closeSheet(){$('#sheet').classList.remove('open');$('#scrim').classList.remove('open')}
function renderStep(){$('#steps').innerHTML=[0,1,2,3].map(i=>`<i class="${i===step?'on':''}"></i>`).join('');if(step===0)panel.innerHTML=`<div class="panel"><h3>What would you like to reserve?</h3><p>Choose a resource and we will show its open times.</p><div class="choices">${Object.entries(TYPES).map(([key,value])=>`<button class="choice" data-pick="${key}"><span class="tile">${value.label[0]}</span><span><strong>${value.label}</strong><small>${value.units.length} spaces available today</small></span></button>`).join('')}</div></div>`;else if(step===1)panel.innerHTML=`<div class="panel"><h3>What is ${draft.unit||'this '+TYPES[draft.type].label.toLowerCase()} for?</h3><p>Purpose determines reservation priority.${draft.start?' Your start time is '+draft.start+'.':''}</p><div class="choices"><button class="choice purpose contact" data-purpose="contact"><span class="tile">1</span><span><strong>Contact</strong><small>Highest priority</small></span></button><button class="choice purpose new" data-purpose="new"><span class="tile">2</span><span><strong>New Member</strong><small>Second priority</small></span></button><button class="choice purpose other" data-purpose="other"><span class="tile">3</span><span><strong>Other</strong><small>Tell us what it is for</small></span></button></div></div>`;else if(step===2)panel.innerHTML=`<div class="panel"><h3>When should it start?</h3><p>Choose an available time.</p><div class="timeChoices">${TIMES.map(([start])=>`<button data-start="${start}">${start}</button>`).join('')}</div></div>`;else if(step===3)panel.innerHTML=`<div class="panel"><h3>When should it end?</h3><p>Starting at ${draft.start}.</p><div class="timeChoices">${TIMES.slice(Math.max(0,TIMES.findIndex(([start])=>start===draft.start))).map(([,end])=>`<button data-end="${end}">${end}</button>`).join('')}</div></div>`;else panel.innerHTML=`<div class="panel"><h3>Confirm your reservation</h3><p>One final check before it is placed on the schedule.</p><div class="summary"><div><span>Space</span><b>${draft.unit||TYPES[draft.type].label}</b></div><div><span>Purpose</span><b>${label(draft.purpose)}</b></div><div><span>Time</span><b>${draft.start} to ${draft.end}</b></div></div><input class="field" id="name" placeholder="Your name"><button class="continue" id="confirm">Confirm reservation</button></div>`;wire()}
function wire(){panel.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{draft.type=b.dataset.pick;setType(draft.type);step=1;renderStep()});panel.querySelectorAll('[data-purpose]').forEach(b=>b.onclick=()=>{draft.purpose=b.dataset.purpose;step=draft.start?3:2;renderStep()});panel.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>{draft.start=b.dataset.start;step=3;renderStep()});panel.querySelectorAll('[data-end]').forEach(b=>b.onclick=()=>{draft.end=b.dataset.end;step=4;renderStep()});const confirm=$('#confirm');if(confirm)confirm.onclick=()=>{const name=$('#name').value.trim();if(!name){$('#name').focus();return}panel.innerHTML=`<div class="done"><div class="check">✓</div><h3>You're reserved.</h3><p>${name}, ${draft.unit||TYPES[draft.type].label} is held from ${draft.start} to ${draft.end}.</p><button class="continue" id="finish">Return to schedule</button></div>`;$('#finish').onclick=closeSheet}}
document.querySelectorAll('[data-type]').forEach(button=>button.onclick=()=>setType(button.dataset.type));$('#reserve').onclick=()=>openSheet();$('#close').onclick=closeSheet;$('#scrim').onclick=closeSheet;renderSchedule();
</script>
</body>
</html>
