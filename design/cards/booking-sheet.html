<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booking bottom sheet</title>
<style>
/* LV Zion Study Rooms — design tokens (single source of truth)
   Crisp & efficient: one sans family, cool neutrals, one decisive blue,
   four status colors that stay distinguishable in light AND dark. */

:root {
  color-scheme: light dark;

  /* type */
  --sans: -apple-system, BlinkMacSystemFont, "Avenir Next", "Segoe UI", Roboto, sans-serif;
  --fs-xs: 12px;
  --fs-sm: 13.5px;
  --fs-md: 15px;
  --fs-lg: 17px;
  --fs-xl: 22px;
  --fs-title: 26px;

  /* shape */
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
  --r-pill: 999px;
  --tap: 44px;

  /* light theme (default) */
  --bg: #F5F6F8;
  --surface: #FFFFFF;
  --surface-sunken: #EDEFF3;
  --line: #E2E5EB;
  --line-strong: #C9CED8;
  --ink: #171A20;
  --ink-soft: #4E5666;
  --ink-faint: #7A828F;

  --primary: #2F52D9;
  --primary-strong: #2542B8;
  --primary-tint: #E9EDFC;
  --primary-ink: #FFFFFF;

  --ok: #147A56;          /* confirmed */
  --ok-tint: #E1F3EC;
  --info: #4C86E8;        /* tentative */
  --info-tint: #E8F0FD;
  --warn: #9A6407;        /* waiting / requested */
  --warn-tint: #FBF0DA;
  --danger: #C23A30;
  --danger-tint: #FBE9E7;

  --shadow-card: 0 1px 2px rgba(23, 26, 32, 0.05), 0 6px 16px -10px rgba(23, 26, 32, 0.12);
  --shadow-sheet: 0 -8px 32px rgba(23, 26, 32, 0.18);
  --focus-ring: 0 0 0 3px color-mix(in srgb, var(--primary) 35%, transparent);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101216;
    --surface: #191C22;
    --surface-sunken: #13151A;
    --line: #2A2F39;
    --line-strong: #3A4150;
    --ink: #E9EBEF;
    --ink-soft: #ADB4C0;
    --ink-faint: #7E8592;

    --primary: #7E97FF;
    --primary-strong: #97ABFF;
    --primary-tint: #232A45;
    --primary-ink: #0E1220;

    --ok: #4ADE9E;
    --ok-tint: #15302A;
    --info: #7FB0F7;
    --info-tint: #1C2A42;
    --warn: #F0B45A;
    --warn-tint: #362A14;
    --danger: #F2776C;
    --danger-tint: #3A1F1C;

    --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 16px -10px rgba(0, 0, 0, 0.5);
    --shadow-sheet: 0 -8px 32px rgba(0, 0, 0, 0.55);
  }
}

/* LV Zion Study Rooms — component styles (one generation, no overrides).
   Every class name matches what app.js emits today. */

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--sans);
  font-size: var(--fs-md);
  line-height: 1.45;
  background: var(--bg);
  color: var(--ink);
}
button { font: inherit; color: inherit; }
:focus-visible { outline: none; box-shadow: var(--focus-ring); }

/* ---------- header + tabs ---------- */
#masthead {
  position: sticky;
  top: 0;
  z-index: 30;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  cursor: pointer;
}
.head-in {
  max-width: 760px;
  margin: 0 auto;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.head-brand { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.head-title { font-size: var(--fs-lg); font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
.head-date { font-size: var(--fs-xs); color: var(--ink-faint); }
.sync-pill {
  font-size: var(--fs-xs);
  font-weight: 600;
  color: var(--ok);
  display: inline-flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
}
.sync-pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.sync-pill.off { color: var(--warn); }

.tabs {
  display: flex;
  gap: 6px;
  max-width: 760px;
  margin: 0 auto;
  padding: 0 14px 8px;
}
.tab {
  flex: 1 1 0;
  min-height: 38px;
  padding: 7px 10px;
  border: 1px solid var(--line);
  border-radius: var(--r-pill);
  background: var(--surface);
  color: var(--ink-soft);
  font-size: var(--fs-sm);
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}
.tab.active {
  background: var(--primary);
  border-color: var(--primary);
  color: var(--primary-ink);
}

/* ---------- layout ---------- */
.wrap { max-width: 760px; margin: 0 auto; padding: 14px 12px 64px; }
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-card);
  padding: 16px;
  margin: 14px 0;
}
h1 { font-size: var(--fs-title); font-weight: 800; letter-spacing: -0.02em; margin: 10px 0 4px; }
h2 { font-size: var(--fs-lg); font-weight: 700; letter-spacing: -0.01em; margin: 0 0 10px; }
.member-intro p, .section-note, .hint { color: var(--ink-soft); font-size: var(--fs-sm); margin: 4px 0 10px; }
.calendar-help { color: var(--ink-faint); font-size: var(--fs-sm); margin: 8px 0; }

/* ---------- buttons ---------- */
.btn {
  min-height: var(--tap);
  padding: 10px 18px;
  border: 1px solid var(--line-strong);
  border-radius: var(--r-md);
  background: var(--surface);
  font-weight: 600;
  cursor: pointer;
}
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.btn.primary:active { background: var(--primary-strong); }
.btn.danger { border-color: var(--danger); color: var(--danger); background: transparent; }
.btn.small { min-height: 34px; padding: 6px 12px; font-size: var(--fs-sm); }
.btn[disabled] { opacity: 0.55; cursor: default; }

/* ---------- status chips & badges ---------- */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  border-radius: var(--r-pill);
  font-size: var(--fs-xs);
  font-weight: 700;
}
.status-approved { background: var(--ok-tint); color: var(--ok); }
.status-pending, .status-waiting { background: var(--warn-tint); color: var(--warn); }
.status-cancelled, .status-declined { background: var(--danger-tint); color: var(--danger); }
.badge-cert.confirmed { color: var(--ok); }
.badge-cert.tentative { color: var(--info); }

/* ---------- date selector ---------- */
.date-selector { display: flex; gap: 8px; }
.date-choice {
  flex: 1 1 0;
  min-height: var(--tap);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface);
  padding: 8px 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  cursor: pointer;
}
.date-choice-day { font-weight: 700; font-size: var(--fs-sm); }
.date-choice-date { font-size: var(--fs-xs); color: var(--ink-faint); }
.date-choice.active { border-color: var(--primary); background: var(--primary-tint); }
.date-choice.active .date-choice-day { color: var(--primary); }

/* ---------- resource toggle ---------- */
.member-resource-toggle { display: flex; gap: 8px; margin: 10px 0; }
.member-resource {
  flex: 1 1 0;
  min-height: 40px;
  border: 1px solid var(--line);
  border-radius: var(--r-pill);
  background: var(--surface);
  font-weight: 600;
  font-size: var(--fs-sm);
  cursor: pointer;
}
.member-resource.active { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }

/* ---------- member calendar grid ---------- */
.member-calendar-heading { display: flex; align-items: baseline; justify-content: space-between; margin-top: 12px; }
.member-calendar-heading span { color: var(--ink-faint); font-size: var(--fs-sm); }
.member-calendar-scroll { border: 1px solid var(--line); border-radius: var(--r-md); overflow: auto; max-height: 60vh; background: var(--surface); }
.member-calendar-row {
  display: grid;
  grid-template-columns: 86px 1fr;
  border-bottom: 1px solid var(--line);
}
.member-calendar-row:last-child { border-bottom: 0; }
.unit-header { position: sticky; top: 0; z-index: 2; background: var(--surface-sunken); font-size: var(--fs-xs); }
.unit-header .member-squares span { display: grid; place-items: center; color: var(--ink-faint); font-weight: 700; }
.member-time {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 6px 8px;
  font-size: var(--fs-sm);
  font-weight: 700;
  color: var(--ink-soft);
  border: 0;
  background: transparent;
  text-align: left;
}
.member-time small { font-size: 10px; color: var(--ink-faint); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
.member-time.selectable { cursor: pointer; color: var(--primary); }
.member-time.selectable.selected { background: var(--primary-tint); border-radius: var(--r-sm); }
.member-squares {
  display: grid;
  grid-template-columns: repeat(var(--capacity), minmax(0, 1fr));
  gap: 4px;
  padding: 4px 6px 4px 0;
}
.member-square {
  min-height: 40px;
  border-radius: var(--r-sm);
  border: 1px solid var(--line);
  background: var(--surface);
  font-size: 10.5px;
  line-height: 1.15;
  padding: 3px 4px;
  color: var(--ink-soft);
  overflow: hidden;
  display: grid;
  place-items: center;
  text-align: center;
}
.member-square.taken { background: var(--surface-sunken); border-color: transparent; color: var(--ink-soft); font-weight: 600; }
.member-square.mine { background: var(--ok-tint); border-color: var(--ok); color: var(--ok); font-weight: 700; }
.member-square.pending { background: transparent; border: 1.5px dashed var(--warn); }
.member-square.cancelled { background: transparent; border: 1.5px dashed var(--line-strong); }
.member-square.selected { background: var(--primary-tint); border-color: var(--primary); }
.member-square.booking-start { border-radius: var(--r-sm) var(--r-sm) 0 0; border-bottom: 0; }
.member-square.booking-middle { border-radius: 0; border-top: 0; border-bottom: 0; }
.member-square.booking-end { border-radius: 0 0 var(--r-sm) var(--r-sm); border-top: 0; }
.member-service {
  display: flex;
  justify-content: space-between;
  padding: 8px 10px;
  background: var(--warn-tint);
  color: var(--warn);
  font-weight: 700;
  font-size: var(--fs-sm);
  border-bottom: 1px solid var(--line);
}
.member-selection-summary {
  position: sticky;
  bottom: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 10px;
  padding: 10px 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-card);
}

/* ---------- activity feed ---------- */
.activity-feed { margin: 14px 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-card); padding: 14px 16px; }
.activity-title { font-size: var(--fs-xs); font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 8px; }
.activity-table { overflow-x: auto; }
.activity-row {
  display: grid;
  grid-template-columns: minmax(150px, 1.4fr) minmax(110px, 1fr) minmax(100px, 1fr) 74px 74px;
  gap: 8px;
  padding: 7px 0;
  border-bottom: 1px solid var(--line);
  font-size: var(--fs-sm);
  min-width: 520px;
}
.activity-row:last-child { border-bottom: 0; }
.activity-head { color: var(--ink-faint); font-size: var(--fs-xs); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
.activity-row.approved strong { color: var(--ok); }
.activity-row.pending strong { color: var(--warn); }
.activity-row.cancelled strong { color: var(--danger); }

/* ---------- requests / my reservations ---------- */
.req-row { padding: 10px 0; border-bottom: 1px solid var(--line); }
.req-row:last-child { border-bottom: 0; }
.req-head { font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.req-sub { color: var(--ink-soft); font-size: var(--fs-sm); margin-top: 2px; }
.req-actions { margin-top: 6px; }
.cancel-link { color: var(--danger); font-size: var(--fs-sm); font-weight: 600; text-decoration: none; }
.cancel-link:hover { text-decoration: underline; }
.approval-notice {
  margin: 14px 0;
  padding: 12px 14px;
  border-radius: var(--r-md);
  background: var(--ok-tint);
  color: var(--ok);
  font-size: var(--fs-sm);
  font-weight: 600;
}

/* ---------- banners ---------- */
#banners { position: fixed; left: 12px; right: 12px; bottom: 14px; z-index: 60; display: grid; gap: 8px; }
#banners:empty { display: none; }
.banner {
  background: var(--ink);
  color: var(--bg);
  padding: 12px 14px;
  border-radius: var(--r-md);
  font-size: var(--fs-sm);
  font-weight: 600;
  box-shadow: var(--shadow-card);
}
.banner.error { background: var(--danger); color: #fff; }

/* ---------- booking sheet (modal) ---------- */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(10, 12, 16, 0.45);
  z-index: 50;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.booking-dialog {
  width: 100%;
  max-width: 560px;
  max-height: 88vh;
  overflow: auto;
  background: var(--surface);
  border-radius: var(--r-lg) var(--r-lg) 0 0;
  box-shadow: var(--shadow-sheet);
  padding: 18px 18px 22px;
}
@media (min-width: 600px) {
  .modal-backdrop { align-items: center; }
  .booking-dialog { border-radius: var(--r-lg); }
}
.booking-dialog-head { display: flex; justify-content: space-between; align-items: flex-start; }
.booking-kicker { font-size: var(--fs-xs); font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--primary); }
.modal-close {
  width: 40px; height: 40px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--surface);
  font-size: 20px;
  cursor: pointer;
  color: var(--ink-soft);
}
.booking-time-summary {
  background: var(--primary-tint);
  color: var(--ink);
  border-radius: var(--r-md);
  padding: 10px 12px;
  font-size: var(--fs-md);
}
.booking-time-summary strong { color: var(--primary); }
.booking-approval-hint { margin-top: 6px; }
.fld { font-size: var(--fs-xs); font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); margin: 14px 0 6px; }
input[type="text"], input[type="password"], select, textarea {
  width: 100%;
  min-height: var(--tap);
  padding: 10px 12px;
  border: 1px solid var(--line-strong);
  border-radius: var(--r-md);
  background: var(--surface);
  color: var(--ink);
  font: inherit;
}
input:focus-visible, select:focus-visible, textarea:focus-visible { border-color: var(--primary); box-shadow: var(--focus-ring); }
.need-row { display: flex; gap: 8px; flex-wrap: wrap; }
.need-chip, .purpose-chip, .pref-chip, .certainty-btn {
  min-height: 40px;
  padding: 8px 14px;
  border: 1px solid var(--line);
  border-radius: var(--r-pill);
  background: var(--surface);
  font-size: var(--fs-sm);
  font-weight: 600;
  cursor: pointer;
}
.need-chip.active, .purpose-chip.active, .pref-chip.active { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.certainty-btn.confirmed.active { background: var(--ok-tint); border-color: var(--ok); color: var(--ok); }
.certainty-btn.tentative.active { background: var(--info-tint); border-color: var(--info); color: var(--info); }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }

/* ---------- admin ---------- */
.lock-title { font-size: var(--fs-xl); font-weight: 800; letter-spacing: -0.01em; margin-bottom: 4px; }
.pin-row { display: flex; gap: 10px; }
.pin-row input { flex: 1 1 auto; text-align: center; letter-spacing: 0.35em; font-weight: 700; }
.pin-error { color: var(--danger); font-weight: 600; font-size: var(--fs-sm); margin-top: 8px; }
.pending-lane { margin-top: 10px; border: 1px dashed var(--warn); border-radius: var(--r-md); padding: 10px 12px; background: var(--warn-tint); }
.pending-lane-title { font-size: var(--fs-xs); font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: var(--warn); margin-bottom: 6px; }
.assign-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
.assign-chip {
  min-height: 38px;
  padding: 7px 12px;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface);
  font-size: var(--fs-sm);
  font-weight: 600;
  cursor: pointer;
}
.assign-chip.active { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.assign-chip.recommended::after { content: " ★"; color: var(--warn); }
.assign-chip[disabled] { opacity: 0.45; cursor: default; }

/* ---------- misc ---------- */
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.footer-note { text-align: center; color: var(--ink-faint); font-size: var(--fs-sm); padding: 20px 0 30px; }
.demo-notice { background: var(--info-tint); color: var(--info); border-radius: var(--r-md); padding: 10px 12px; font-size: var(--fs-sm); font-weight: 600; margin: 10px 0; }
@media (prefers-reduced-motion: no-preference) {
  .tab, .btn, .date-choice, .member-resource, .need-chip, .purpose-chip { transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease; }
}

body { padding-bottom: 20px; }
</style>
</head>
<body>

<div class="modal-backdrop" style="position:relative;min-height:640px;align-items:flex-end">
  <section class="booking-dialog">
    <div class="booking-dialog-head">
      <div><div class="booking-kicker">Sat, Jul 18</div><h2>Request this time</h2></div>
      <button class="modal-close">&times;</button>
    </div>
    <p class="booking-time-summary"><strong>Study room</strong> · 11:00 AM–11:30 AM</p>
    <p class="hint booking-approval-hint">Saturday requests go to the approver first — check My reservations for the decision.</p>
    <div class="fld">Your name</div>
    <input type="text" value="Anthony" placeholder="Full name">
    <div class="fld">Purpose</div>
    <div class="need-row">
      <button class="purpose-chip active">Contact</button>
      <button class="purpose-chip">New Member</button>
      <button class="purpose-chip">Meeting</button>
      <button class="purpose-chip">Other</button>
    </div>
    <div class="modal-actions"><button class="btn">Cancel</button><button class="btn primary">Send request</button></div>
  </section>
</div>
</body>
</html>
